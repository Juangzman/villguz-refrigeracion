<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turnos VILLGUZ</title>
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Turnos: un proceso guiado para atender cada llamada + la planilla de siempre para ver los turnos. */
:root{
  --navy:#003370;--navy-deep:#00224D;--green:#76B72A;--green-ink:#4E8A14;
  --ink:#0C1624;--muted:#56657A;--paper:#fff;--mist:#EEF3F8;--line:#D6DFEA;--grid:#C9D4E2;
  --red:#B3261E;--red-bg:#FFF0EE;--amber:#8A5A00;--amber-bg:#FFF6DD;--ok-bg:#F1F8E8;--violet:#5B2A86;--violet-bg:#F4ECFC;--orange:#A64B00;--orange-bg:#FFEBDC;--teal:#0B5E57;--teal-bg:#E0F2F1;
  --f-display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--mist);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
a{color:var(--navy)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:2px solid var(--line);border-radius:12px;padding:.6em 1.05em;font-weight:700;cursor:pointer;background:#fff;text-decoration:none;white-space:nowrap;min-height:44px;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:#00418f}
.btn-green{background:var(--green);color:#00224D;border-color:var(--green)}
.btn-green:hover{background:#86c63a;border-color:#86c63a}
.btn-danger{color:var(--red);border-color:#F0C4C0}
.btn-wa{background:#25D366;border-color:#25D366;color:#063}
.btn-sm{min-height:34px;padding:.3em .75em;font-size:.84rem;border-radius:10px}
.btn-big{min-height:56px;font-size:1.05rem;padding:.7em 1.4em}
label.f{display:grid;gap:5px;font-size:.85rem;font-weight:700;color:var(--navy)}
label.f small{font-weight:500;color:var(--muted)}
label.f.req>span::after{content:" *";color:var(--red)}
.i{width:100%;border:2px solid var(--line);border-radius:10px;padding:.55em .75em;background:#F7F9FC;font-weight:500;min-height:46px}
textarea.i{min-height:70px;resize:vertical}
.i:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(118,183,42,.22)}
.i.bad{border-color:var(--red);background:var(--red-bg)}
.err{color:var(--red);font-weight:700;font-size:.92rem;margin:0}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:30px;width:min(420px,100%);display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .logo{width:180px;color:var(--ink)}
.login-card h1{font-size:2.4rem;color:var(--navy)}
.login-card p{margin:0;color:var(--muted)}

/* Barra superior */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.top-in{max-width:1600px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-btn{background:none;border:0;padding:0;cursor:pointer;color:#fff;display:flex;align-items:center;gap:10px}
.logo-btn svg{width:110px;height:auto;display:block}
.logo-btn span{font-family:var(--f-display);font-size:1.6rem;color:var(--green);line-height:1}
.ingresar{min-height:52px;font-size:1.02rem;padding:.55em 1.2em;box-shadow:0 0 0 3px rgba(118,183,42,.35)}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:0;border-radius:999px;padding:.7em 1em .7em 2.6em;font-weight:600;background:rgba(255,255,255,.14);color:#fff;min-height:46px}
.search input::placeholder{color:#C3D2E4}
.search input:focus{outline:none;background:#fff;color:var(--ink)}
.search svg{position:absolute;left:.9em;top:50%;transform:translateY(-50%);width:1.2em;height:1.2em;color:#C3D2E4;pointer-events:none}
.cloud{font-size:.78rem;font-weight:700;padding:.4em .85em;border-radius:999px;white-space:nowrap}
.cs-ok{background:rgba(118,183,42,.22);color:#CFF0A6}.cs-wait{background:rgba(255,255,255,.14);color:#fff}.cs-err{background:var(--red);color:#fff}
.top .btn:not(.btn-green){background:transparent;color:#fff;border-color:rgba(255,255,255,.35);min-height:40px}
.nav{background:#fff;border-bottom:1px solid var(--line)}
.nav-in{max-width:1600px;margin:auto;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.tab{border:2px solid transparent;background:none;border-radius:12px;padding:.5em .9em;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:.45em;min-height:46px}
.tab:hover{background:var(--mist);color:var(--navy)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
.tab .n{background:var(--mist);color:var(--navy);border-radius:999px;padding:.05em .55em;font-size:.82rem;min-width:1.7em;text-align:center}
.tab .n.hot{background:var(--red);color:#fff}
.tab .n:empty{display:none}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.2);color:#fff}
.tab[aria-selected="true"] .n.hot{background:var(--red)}
@media (max-width:760px){.top-in{gap:8px}.logo-btn svg{width:76px}.logo-btn span{display:none}.cloud{font-size:0;padding:0;width:14px;height:14px;flex:none}.cs-ok{background:var(--green)}.cs-wait{background:#fff}#logout{padding:.3em .7em}.ingresar{flex:1 1 0;min-width:0;min-height:48px;font-size:.85rem;padding:.4em .5em;overflow:hidden}.search{order:5;flex-basis:100%}}

main{max-width:1600px;margin:auto;padding:16px 16px 60px;display:grid;gap:14px}
.alert{border-radius:14px;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid;text-align:left;width:100%;font-size:.98rem}
.alert.red{background:var(--red-bg);border-color:#F0B6B1;color:var(--red)}
.alert.amber{background:var(--amber-bg);border-color:#EED79A;color:var(--amber)}
.alert b{font-size:1.5rem;font-family:var(--f-display);font-weight:400}
.vh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.vh h2{font-size:2.1rem;color:var(--navy)}
.vh p{margin:4px 0 0;color:var(--muted);max-width:85ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.4em .95em;font-weight:700;cursor:pointer;min-height:40px;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.sm{min-height:34px;padding:.25em .75em;font-size:.86rem}
.empty{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted);font-weight:600}
.sect{font-family:var(--f-display);font-size:1.6rem;color:var(--navy);margin:6px 0 -6px}

/* Inicio: atender */
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:20px 22px;display:grid;gap:14px}
.hero h2{font-size:2.4rem;color:#fff}
.hero p{margin:0;color:#C9D7E8}
.canales{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.canales{grid-template-columns:1fr 1fr}}
.canal{background:#fff;color:var(--navy);border:0;border-radius:16px;padding:16px 10px;font-weight:800;font-size:1.05rem;cursor:pointer;display:grid;gap:4px;justify-items:center;min-height:96px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.canal:hover{background:#F1F8E8;transform:translateY(-1px)}
.hq span{color:#fff}.hq .i{min-height:56px;font-size:1.05rem;background:#fff}.hres{display:grid;gap:8px}.hres .hc{color:var(--ink)}.hres .tip{color:var(--ink)}
.canal span{font-size:1.8rem;line-height:1}
.canal small{font-weight:600;color:var(--muted);font-size:.78rem}

/* Planilla (tabla tipo Excel) */
.xl-wrap{background:#fff;border:1px solid var(--grid);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px)}
table.xl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:.84rem;line-height:1.3}
.xl th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;font-weight:700;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:8px;white-space:nowrap;border-right:1px solid #1C4C86}
.xl td{padding:6px 8px;border-bottom:1px solid var(--grid);border-right:1px solid #E3E9F1;vertical-align:top;background:#fff}
.xl tbody tr{cursor:pointer}
.xl tbody tr:nth-child(even) td{background:#F8FAFD}
.xl tbody tr:hover td{background:#EAF2FB}
.xl td.nm{font-weight:700;min-width:140px;max-width:200px}
.xl td.dom{min-width:170px;max-width:240px}
.xl td.fa{min-width:150px;max-width:230px}
.xl td.res{min-width:130px;max-width:220px;color:#2B3A4E}
.xl td.ord{font-weight:700;max-width:130px;word-break:break-word;white-space:nowrap}
.xl td.nw{white-space:nowrap}
.xl td.lead{white-space:nowrap;font-weight:800;font-size:.76rem;border-left:6px solid var(--line)}
.xl .act{display:flex;flex-direction:column;gap:4px;margin-top:6px}.xl .act:empty{display:none}
.xl tr.venc td.lead{border-left-color:var(--red);color:var(--red);background:var(--red-bg)!important}
.xl tr.hoy td.lead{border-left-color:#E0A100;color:var(--amber);background:var(--amber-bg)!important}
.xl tr.ok td.lead{border-left-color:var(--green);color:var(--green-ink)}
.xl tr.done td{color:#6B7A8E}
.xl tr.done td.lead{border-left-color:#9AA7B6}
.xl tr.ask td.lead{border-left-color:#E0A100;background:var(--amber-bg)!important;color:var(--amber)}
.xl tr.no td{background:#FFF3F2!important}
.xl tr.day td{background:#E3F3D0!important;font-weight:800;color:var(--navy);cursor:default;font-size:.88rem;text-transform:capitalize;border-bottom:1px solid #BFDDA0}
.xl tr.day.today td{background:#C9E8A6!important}
.xl tr.day td .dnote{background:var(--violet);color:#fff;border-radius:6px;padding:.1em .5em;margin-left:8px;text-transform:none;font-size:.78rem}
.xl tr.day td .btn{margin-left:8px}
.xl tr.tal td{background:var(--violet-bg)!important}
.xl tr.empty-day td{color:var(--muted);font-style:italic;cursor:default;background:#fff!important}
.xl .btn-sm{min-height:32px}
.tel{font-weight:700;text-decoration:none;color:var(--navy);white-space:nowrap}
.flag{display:inline-block;font-size:.7rem;font-weight:800;padding:.1em .45em;border-radius:6px;margin-right:4px;vertical-align:1px}
.flag.complicado{background:var(--amber-bg);color:var(--amber);border:1px solid #EED79A}
.flag.no{background:var(--red);color:#fff}
.pill{display:inline-block;padding:.15em .55em;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap;letter-spacing:.02em}
.p-SG{background:#E3ECF8;color:var(--navy)}
.p-GT{background:#E3F3D0;color:var(--green-ink)}
.p-GTT{background:var(--violet-bg);color:var(--violet)}
.p-AC{background:var(--orange-bg);color:var(--orange)}
.p-x{background:var(--mist);color:var(--muted)}
.p-fl{background:#FFE9D6;color:#8A3B00}
.p-fz{background:var(--teal-bg);color:var(--teal)}
.p-ok{background:var(--ok-bg);color:var(--green-ink)}
.p-bad{background:var(--red-bg);color:var(--red)}
.p-warn{background:var(--amber-bg);color:var(--amber)}
.p-tal{background:var(--violet-bg);color:var(--violet)}

/* Agenda semanal */
.wk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wk-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--navy);font-weight:700}
.wk-lbl{font-family:var(--f-display);font-size:1.6rem;color:var(--navy);min-width:220px}
.ag-tec{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ag-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--navy);color:#fff;flex-wrap:wrap}
.ag-h h3{font-size:1.8rem}
.ag-h .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.ag-days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.ag-day{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.ag-day:last-child{border-right:0}
.ag-dh{padding:7px 9px;background:var(--mist);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.ag-dh b{font-size:.92rem}
.ag-dh .cnt{font-size:.78rem;font-weight:700;color:var(--muted)}
.ag-day.today .ag-dh{background:#E3F3D0}
.ag-cell{padding:7px;display:grid;gap:6px;align-content:start;flex:1;min-height:80px}
.dnote-c{background:var(--violet);color:#fff;border-radius:8px;padding:5px 8px;font-weight:800;font-size:.78rem;cursor:pointer;border:0;text-align:left}
.mini{border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:6px 8px;background:#fff;cursor:pointer;display:grid;gap:2px;text-align:left;width:100%;font-size:.82rem;line-height:1.3}
.mini:hover{border-color:var(--navy)}
.mini b{font-size:.87rem;word-break:break-word}
.mini .sub{color:var(--muted);word-break:break-word}
.mini.GT{border-left-color:var(--green)}.mini.GTT{border-left-color:var(--violet)}.mini.AC{border-left-color:var(--orange)}
.mini.done{background:#F7F9FC;opacity:.75}
.mini.ask{border-color:#EED79A;background:var(--amber-bg)}
.mini.tal{border-left-color:var(--violet);background:var(--violet-bg)}
@media (max-width:1000px){.ag-days{grid-template-columns:1fr}.ag-day{border-right:0;border-bottom:1px solid var(--line)}.ag-cell{min-height:0}.ag-cell:empty::after{content:"Sin turnos";color:var(--muted);font-size:.85rem}}

/* Taller */
.tl-st{display:flex;gap:4px;flex-wrap:wrap}
.st{border:2px solid var(--line);background:#fff;border-radius:8px;padding:.15em .5em;font-weight:700;font-size:.75rem;cursor:pointer;min-height:30px}
.st.on{color:#fff}
.st.on[data-s="esperando"]{background:#56657A;border-color:#56657A}
.st.on[data-s="en_reparacion"]{background:var(--navy);border-color:var(--navy)}
.st.on[data-s="repuesto"]{background:#C07A00;border-color:#C07A00}
.st.on[data-s="listo"]{background:var(--green-ink);border-color:var(--green-ink)}
.st.on[data-s="entregado"]{background:#9AA7B6;border-color:#9AA7B6}

/* Ventana (modal) y proceso */
.ov{position:fixed;inset:0;background:rgba(0,20,45,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}
.md{background:#fff;border-radius:20px;width:min(860px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column}
.md-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.md-h h2{font-size:2rem;color:var(--navy)}
.md-x{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.5rem;cursor:pointer;flex:none}
.md-b{padding:16px 20px;display:grid;gap:16px}
.md-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 20px 20px;z-index:3}
.md-f .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.ov{padding:0}.md{border-radius:0;min-height:100%}.md-f{border-radius:0}.md-f .btn{flex:1}}
.pasos{display:flex;gap:4px;padding:10px 20px;background:var(--mist);border-bottom:1px solid var(--line);overflow-x:auto}
.paso{flex:1;min-width:92px;text-align:center;font-size:.74rem;font-weight:700;color:var(--muted);padding:6px 4px;border-radius:8px;border:0;background:none;cursor:pointer}
.paso b{display:block;font-size:1.1rem;font-family:var(--f-display);font-weight:400}
.paso.on{background:var(--navy);color:#fff}
.paso.done{color:var(--green-ink)}
.paso:disabled{cursor:default}
.rowq{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}.rowq>.q{font-weight:800;color:var(--navy)}.rowq .opt{min-height:52px}
@media (max-width:600px){.rowq{grid-template-columns:1fr;gap:6px}}
.buscar span{font-size:1rem}.buscar .i{min-height:58px;font-size:1.1rem;border-color:var(--green)}
.decile{border-left:5px solid var(--green);background:var(--ok-bg);border-radius:10px;padding:10px 14px;font-size:.95rem}
.decile b:first-child{display:block;color:var(--green-ink);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.step{display:grid;gap:8px}
.step>.q{font-weight:800;color:var(--navy);font-size:1rem}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:.5em 1em;font-weight:800;cursor:pointer;min-height:50px;display:grid;justify-items:center;align-content:center;line-height:1.15;color:var(--ink)}
.opt small{font-weight:600;color:var(--muted);font-size:.72rem}
.opt:hover{border-color:var(--navy)}
.opt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.on small{color:#C9D7E8}
.opt.tGT.on{background:var(--green-ink);border-color:var(--green-ink)}.opt.tGTT.on{background:var(--violet);border-color:var(--violet)}.opt.tAC.on{background:var(--orange);border-color:var(--orange)}
.opt.fcomplicado.on{background:#C07A00;border-color:#C07A00}.opt.fno.on{background:var(--red);border-color:var(--red)}
.opt.late{border-color:#EED79A;background:var(--amber-bg)}
.opt.late.on{background:#C07A00;border-color:#C07A00}
.repbox{border:2px solid #EED79A;background:#FFFBEF;border-radius:14px;padding:14px;display:grid;gap:12px}
.repbox h4{margin:0;font-size:1rem;color:#8A5A00}
.rp{display:inline-block;font-size:.72rem;font-weight:800;padding:.2em .55em;border-radius:6px;margin:2px 2px 0 0;background:#EEF2F7;color:var(--ink)}
.rp.w{background:#FFF1CC;color:#7A4E00}.rp.g{background:#E3F2D3;color:#2F5E0A}.rp.b{background:#FDE2E2;color:#9B1C1C}
.tecpref{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint-un{font-size:.78rem;color:var(--muted);margin:2px 0 0}
.opt.wide{flex:1;min-width:120px}
.opt.big{min-height:76px;font-size:1.05rem}
.opt.esp{border-color:#9FD06A}
.opts.sm .opt{min-height:40px;padding:.35em .8em;font-size:.88rem}
.days-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.days-pick.dt{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.dcard{border:2px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:4px;background:#fff;align-content:start}
.dcard.late{background:var(--amber-bg);border-color:#EED79A}.dcard.hoy{border-color:#9FD06A}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px}.dh b{font-size:.95rem}.dh small{color:var(--amber);font-weight:700;font-size:.7rem}
.tb{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 8px;text-align:left;cursor:pointer;display:grid;line-height:1.25;color:var(--ink)}
.tb:hover{border-color:var(--navy)}.tb b{font-size:.9rem}.tb small{font-size:.72rem;color:var(--muted)}
.tb.esp{border-color:#9FD06A}.tb.on{background:var(--navy);border-color:var(--navy);color:#fff}.tb.on small{color:#C9D7E8}
.flag.urg{background:#FFE1D6;color:#9A2B00;border:1px solid #F3B49B}
.days-pick .opt{justify-items:start;text-align:left}
.tip{background:var(--mist);border-radius:12px;padding:10px 14px;font-size:.92rem}
.tip.warn{background:var(--amber-bg);color:var(--amber);font-weight:700}
.tip.bad{background:var(--red-bg);color:var(--red);font-weight:700;border:2px solid #F0B6B1}
.tip.good{background:var(--ok-bg);color:var(--green-ink);font-weight:700}
.resumen{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-size:.92rem}
.resumen b.k{display:inline-block;min-width:110px;color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase}
/* Clientes */
.hc{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.hc.no{border-color:var(--red);background:#FFF6F5}
.hc.complicado{border-color:#E0B44C}
.hc-top{display:flex;justify-content:space-between;gap:8px;align-items:start;flex-wrap:wrap}
.hc-top b{font-size:1.02rem}
.hc ul{margin:0;padding-left:18px;font-size:.84rem;color:#2B3A4E}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.8em 1.3em;border-radius:14px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.card h3{font-size:1.7rem;color:var(--navy)}
.tecrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tecrow .i{flex:1;min-width:160px}

/* Impresión */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:10px}
  #app,#login,.ov,.toast{display:none!important}
  #print{display:block}
  .pr-h{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #003370;padding-bottom:6px;margin-bottom:8px}
  .pr-h svg{width:110px;color:#0C1624}
  .pr-h h1{font-size:26px;color:#003370}
  .pr-day{font-weight:700;font-size:13px;margin:10px 0 4px;color:#003370;text-transform:capitalize}
  .pr-t{width:100%;border-collapse:collapse}
  .pr-t th,.pr-t td{border:1px solid #99A;padding:3px 4px;text-align:left;vertical-align:top}
  .pr-t th{background:#E3ECF8;font-size:9px}
  .pr-t tr{page-break-inside:avoid}
}

<script>
'use strict';
var CLOUD='https://script.google.com/macros/s/AKfycbwxcZ1uYbEzdZW_BlP0alWrk3eYNXqFeoERjm2Ew4Z5Rbf11xYvPV2rfitZXLqHsMK_uQ/exec';if(CLOUD.indexOf('{{')===0)CLOUD='';
var KEY='villguz_turnos_v3',QK='villguz_turnos_q3';
var DEF={tecnicos:['Marcelo','Gabi','Jorge'],inactivos:[],
  esp:{Marcelo:'HEL, FREEZER',Gabi:'LAV, HEL, AIRE',Jorge:'LAV, LAVAVAJ, LAVASECA, SEC'},
  empleados:['Melina','Griselda','Inés','Juan'],
  zonas:['SMT Centro','SMT Norte','SMT Sur','SMT Este','SMT Oeste','Yerba Buena','Tafí Viejo','Las Talitas','Banda del Río Salí','Alderetes','El Manantial','San Pablo','Lules','Otra localidad'],
  zonasFuera:['Otra localidad'],costos:[30000,35000],revisionLocal:20000,fleteros:['Fletero'],
  msgSG:'{SALUDO}\n\nMe comunico de VillGuz Refrigeración para confirmar la visita del técnico para el día *{DIA}*.\n\nPor favor, confirme lo siguiente:\n\n1️⃣ Que habrá un mayor de 18 años para recibir al técnico.\n2️⃣ Envíenos su ubicación (clic en el clip 📎 > Ubicación > Enviar mi ubicación actual. NO en tiempo real).\n\n⚠️ *Recordatorios:*\n\n* *Costo de visita: {COSTO} en efectivo.*\n* *Rango horario:* 9:00 a 14:00 hs (sin hora fija).\n* *Tolerancia:* El técnico aguardará 15 minutos. De no haber respuesta, deberá retirarse y se reprogramará el turno.\n* *IMPORTANTE: De no confirmar este mensaje, el servicio será cancelado o reprogramado automáticamente.*\n\nAguardamos su respuesta.\nMuchas gracias, que tenga un buen día.',
  msgGT:'{SALUDO}\n\nMe comunico de VillGuz Refrigeración para confirmar el turno de su visita técnica en garantía para el día *{DIA}*.\n\nPara poder confirmar el turno, por favor necesitamos lo siguiente:\n\n1️⃣ *Envíenos una foto o PDF con la factura de compra del equipo (requisito indispensable).*\n2️⃣ Confirme que habrá un mayor de 18 años para recibir al técnico.\n3️⃣ Envíenos su ubicación (clic en el clip 📎 > Ubicación > Enviar mi ubicación actual. NO en tiempo real).\n\n⚠️ Recordatorios:\n\n* Rango horario: 9:00 a 14:00 hs (sin hora fija).\n* Tolerancia: El técnico aguardará 15 minutos. De no haber respuesta, deberá retirarse y se reprogramará el turno.\n\n*IMPORTANTE: De no enviar la factura y confirmar este mensaje, el servicio será cancelado o reprogramado automáticamente.*\n\nAguardamos su respuesta.\nMuchas gracias, que tenga un buen día.'};
var DB={cfg:JSON.parse(JSON.stringify(DEF)),items:[]},byId={};
var CPW='',CVER=0,pushing=false,pushT=null,Q={ch:{},del:{},cfg:null};
var VIEW='inicio',FILT={zona:'todas',tipo:'todos',ag:'todos',tal:'activos',cli:''},WK=null,AGMODO='planilla',YO='';
try{AGMODO=localStorage.getItem('vt_agmodo')||'planilla';YO=localStorage.getItem('vt_yo')||'';}catch(e){}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(m,ms){document.querySelectorAll('.toast').forEach(function(x){x.remove();});var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},ms||3200);}
function money(n){return '$'+Number(n||0).toLocaleString('es-AR');}
function nk(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim();}

/* ---------- Fechas ---------- */
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function pd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function today(){return iso(new Date());}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function dow(s){return pd(s).getDay();}
function monday(s){var w=dow(s);return addD(s,w===0?-6:1-w);}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
var DN=['dom','lun','mar','mié','jue','vie','sáb'],DL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function dd(s){if(!s)return '';var d=pd(s);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);}
function ddy(s){if(!s)return '';return dd(s)+'/'+s.slice(2,4);}
function fD(s){return s?DN[dow(s)]+' '+dd(s):'';}
function fL(s){return s?DL[dow(s)]+' '+dd(s):'';}

/* ---------- Reglas ----------
   S/G: turno dentro de la misma semana en que entró el pedido (hasta el viernes).
   GTIA, GTIA TALLER y ACEPTADO: como mucho hasta el viernes de la semana siguiente.
   Si entra sábado o domingo, cuenta desde la semana que empieza. */
var TIPO={GT:'GTIA',SG:'S/G',GTT:'GTIA TALLER',AC:'ACEPTADO'};
var SOL={ok:'✔ Solucionado',volver:'🔁 Hay que volver',presu:'💲 Presupuestado',acepto:'👍 Aceptó presupuesto',repuesto:'🔩 Necesita repuesto',taller:'🔧 Se lleva al taller',ausente:'🚪 No estaba',retirado:'✔ Retiro realizado',entregado:'✔ Entrega realizada',externo:'🚚 Flete externo del cliente'};
var SOL_VISITA=['ok','volver','presu','acepto','repuesto','taller','ausente'];
function base(t){return t.ingreso||t.alta||'';}
function plazo(t){var b=base(t);if(!b)return '';var m=monday(b);if(dow(b)===6||dow(b)===0)m=addD(m,7);return addD(m,t.tipo==='SG'?4:11);}
function sem(t){var p=plazo(t);if(!p)return 'sin';var d=diff(today(),p);return d<0?'venc':d<=1?'hoy':'ok';}
function plazoCorto(t){var p=plazo(t);if(!p)return 'Sin fecha';var d=diff(today(),p);if(d<0)return 'VENCIDO '+(-d)+'d';if(d===0)return 'HOY';if(d===1)return 'Mañana';return 'hasta '+fD(p);}
function esFuera(t){return DB.cfg.zonasFuera.indexOf(t.zona)>=0;}

/* ---------- Datos ---------- */
function norm(){var c=DB.cfg=DB.cfg||{};Object.keys(DEF).forEach(function(k){if(c[k]==null)c[k]=JSON.parse(JSON.stringify(DEF[k]));});DB.items=DB.items||[];index();}
function index(){byId={};DB.items.forEach(function(it){byId[it.id]=it;});FLG=null;}
function tecs(){return DB.cfg.tecnicos.filter(function(n){return DB.cfg.inactivos.indexOf(n)<0;});}
function turnos(){return DB.items.filter(function(t){return t.kind==='turno'&&t.estado!=='cancelado';});}
function clientes(){return DB.items.filter(function(t){return t.kind==='cliente';});}
function L_sin(){return turnos().filter(function(t){return t.estado==='pendiente'&&!t.flete&&!esFuera(t);});}
function L_conf(){var t0=today();return turnos().filter(function(t){return t.estado==='asignado'&&t.fecha>=t0&&t.conf!=='confirmada';});}
function L_rep(){return turnos().filter(function(t){return t.estado==='repuesto';});}
function L_fle(){return turnos().filter(function(t){return t.flete&&(t.estado==='pendiente'||t.estado==='asignado');});}
function L_fue(){return turnos().filter(function(t){return esFuera(t)&&!t.flete&&(t.estado==='pendiente'||t.estado==='asignado');});}
function L_tal(){return DB.items.filter(function(t){return t.kind==='taller'&&t.estado!=='entregado';});}
function cache(){try{localStorage.setItem(KEY,JSON.stringify({v:CVER,d:DB}));}catch(e){try{localStorage.removeItem(KEY);}catch(x){}}}
function storeQ(){try{localStorage.setItem(QK,JSON.stringify(Q));}catch(e){}}
function qEmpty(){return !Object.keys(Q.ch).length&&!Object.keys(Q.del).length&&!Q.cfg;}
function touch(it){it.mod=Date.now();if(!byId[it.id]){DB.items.push(it);byId[it.id]=it;}Q.ch[it.id]=it;delete Q.del[it.id];FLG=null;storeQ();cache();sched();}
function drop(it){if(!it)return;DB.items=DB.items.filter(function(x){return x.id!==it.id;});delete byId[it.id];delete Q.ch[it.id];Q.del[it.id]=1;FLG=null;storeQ();cache();sched();}
function saveCfg(){Q.cfg=JSON.parse(JSON.stringify(DB.cfg));storeQ();cache();sched();}
function reapply(){Object.keys(Q.ch).forEach(function(id){var it=Q.ch[id];if(byId[id]){DB.items[DB.items.indexOf(byId[id])]=it;}else DB.items.push(it);byId[id]=it;});
  if(Object.keys(Q.del).length)DB.items=DB.items.filter(function(x){return !Q.del[x.id];});if(Q.cfg)DB.cfg=Q.cfg;index();}
function adopt(data){DB=data||{cfg:{},items:[]};delete DB.dels;norm();reapply();cache();render();}
function applyDelta(dl){if(!dl)return;var pos={};DB.items.forEach(function(it,i){pos[it.id]=i;});
  (dl.items||[]).forEach(function(it){if(pos.hasOwnProperty(it.id))DB.items[pos[it.id]]=it;else{pos[it.id]=DB.items.length;DB.items.push(it);}});
  if(dl.dels&&dl.dels.length){var s={};dl.dels.forEach(function(id){s[id]=1;});DB.items=DB.items.filter(function(x){return !s[x.id];});}
  if(dl.cfg)DB.cfg=dl.cfg;norm();reapply();cache();if(!OV)render();else counts();}

/* ---------- Drive ---------- */
async function api(action,extra){var ac=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ac)ac.abort();},90000);
  try{var r=await fetch(CLOUD,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,pw:CPW},extra||{})),redirect:'follow',signal:ac?ac.signal:undefined});
    var txt=await r.text();try{return JSON.parse(txt);}catch(e){return {ok:false,error:/ocupad|lock|Lock/i.test(txt)?'ocupado':'respuesta'};}}finally{clearTimeout(to);}}
function cstat(st,m){var el=$('cloudSt');el.className='cloud cs-'+st;el.textContent=m;}
function sched(){cstat('wait','Guardando…');clearTimeout(pushT);pushT=setTimeout(push,800);}
async function push(){if(!CLOUD||!CPW)return;if(pushing){clearTimeout(pushT);pushT=setTimeout(push,600);return;}
  if(qEmpty()){cstat('ok','Guardado en Drive');return;}
  // se sube de a partes para que una carga grande no trabe a los demás
  pushing=true;var have=CVER,ck=Object.keys(Q.ch).slice(0,600),dk=Object.keys(Q.del).slice(0,3000),snap={ch:{},del:{},cfg:Q.cfg};
  ck.forEach(function(k){snap.ch[k]=Q.ch[k];delete Q.ch[k];});dk.forEach(function(k){snap.del[k]=1;delete Q.del[k];});Q.cfg=null;
  var falta=Object.keys(Q.ch).length;if(falta)cstat('wait','Subiendo… faltan '+falta.toLocaleString('es-AR'));
  try{var r=await api('save',{changes:Object.keys(snap.ch).map(function(k){return snap.ch[k];}),deletes:Object.keys(snap.del),cfg:snap.cfg,have:have});
    if(r.ok){CVER=r.version;storeQ();if(r.delta)applyDelta(r.delta);else if(r.data)adopt(r.data);else cache();}
    else{restore(snap);if(r.error==='clave'){cstat('err','La contraseña cambió: volvé a entrar');pushing=false;return;}throw 0;}
  }catch(e){restore(snap);pushing=false;cstat('err','Sin conexión · reintentando');clearTimeout(pushT);pushT=setTimeout(push,6000);return;}
  pushing=false;if(!qEmpty()){clearTimeout(pushT);pushT=setTimeout(push,300);}else cstat('ok','Guardado en Drive');}
function restore(s){Object.keys(s.ch).forEach(function(id){if(!Q.ch[id]&&!Q.del[id])Q.ch[id]=s.ch[id];});Object.keys(s.del).forEach(function(id){Q.del[id]=1;});if(s.cfg&&!Q.cfg)Q.cfg=s.cfg;storeQ();}
async function poll(){if(!CLOUD||!CPW||document.hidden||pushing||!qEmpty())return;
  try{var r=await api('load',{have:CVER});if(!r.ok||r.same)return;CVER=r.version;if(r.delta)applyDelta(r.delta);else if(r.data)adopt(r.data);}catch(e){}}
setInterval(poll,25000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
window.addEventListener('beforeunload',function(e){if(CLOUD&&(!qEmpty()||pushing)){e.preventDefault();e.returnValue='';}});

/* ---------- Ingreso ---------- */
var firstRun=false;
function setupUI(){firstRun=true;$('loginTitle').textContent='Crear contraseña';$('loginSub').textContent='Es la primera vez. Elegí la contraseña de turnos (distinta a la del panel). Sirve en todas las compus y celulares.';$('pw2wrap').hidden=false;$('loginBtn').textContent='Crear y entrar';}
async function login(p,silent){var err=$('loginErr');err.hidden=true;
  $('loginBtn').disabled=true;$('loginBtn').textContent='Conectando…';
  try{CPW=p;
    if(firstRun){if(p.length<6)throw 'Usá al menos 6 letras o números.';if(p!==$('pw2').value)throw 'Las dos contraseñas no son iguales.';var s=await api('setup');if(!s.ok&&s.error!=='ya_configurado')throw 'No se pudo crear la contraseña.';}
    var c=null;try{c=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
    var r=await api('load',{have:c&&c.v||0});
    if(!r.ok){if(r.error==='sin_clave'){setupUI();throw silent?'':'Todavía no hay contraseña: creala abajo.';}if(r.error==='clave')throw 'Contraseña incorrecta.';if(r.error==='ocupado')throw 'Drive está guardando una carga grande. Esperá un minuto y volvé a tocar Ingresar.';throw 'No se pudo conectar con Drive ('+r.error+'). Probá de nuevo en un minuto.';}
    try{var q=JSON.parse(localStorage.getItem(QK)||'null');if(q&&q.ch)Q=q;}catch(e){}
    CVER=r.version||0;
    if(r.same&&c){DB=c.d;norm();reapply();}
    else if(r.delta&&c){DB=c.d;norm();applyDelta(r.delta);}
    else{DB=r.data||{cfg:JSON.parse(JSON.stringify(DEF)),items:[]};delete DB.dels;norm();reapply();if(!r.data)saveCfg();}
    cache();
    try{sessionStorage.setItem('vt_pw',p);}catch(e){}
    enter();if(!qEmpty())push();else cstat('ok','Guardado en Drive');
  }catch(m){CPW='';if(m){err.textContent=typeof m==='string'?m:(m&&m.name==='AbortError'?'Drive tardó demasiado en responder. Esperá un minuto y probá de nuevo.':m&&m.message&&!/fetch|network/i.test(m.message)?'Error al abrir: '+m.message:'Sin conexión con Google Drive. Probá de nuevo en un minuto.');err.hidden=false;if(m&&m.stack)console.error(m);}}
  $('loginBtn').disabled=false;$('loginBtn').textContent=firstRun?'Crear y entrar':'Ingresar';}
$('loginForm').addEventListener('submit',function(e){e.preventDefault();login($('pw1').value);});
$('logout').addEventListener('click',function(){if(!qEmpty()&&!confirm('Todavía se están guardando cambios. ¿Salir igual?'))return;try{sessionStorage.removeItem('vt_pw');}catch(e){}location.reload();});
var VIEWS=['inicio','agenda','confirmar','repuesto','fletes','fuera','taller','clientes','ajustes'];
function enter(){$('login').hidden=true;$('app').hidden=false;WK=monday(today());var h=(location.hash||'').slice(1);go(VIEWS.indexOf(h)>=0?h:'inicio');}

/* ---------- Navegación ---------- */
function go(v){VIEW=v;$('q').value='';document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v?'true':'false');});try{history.replaceState(null,'','#'+v);}catch(e){}render();window.scrollTo(0,0);}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)go(b.dataset.v);});
$('home').addEventListener('click',function(){go('inicio');});
$('nuevo').addEventListener('click',function(){proceso({});});
var qT;$('q').addEventListener('input',function(){clearTimeout(qT);qT=setTimeout(render,220);});
function setN(id,n,hot){$(id).textContent=n?n:'';$(id).classList.toggle('hot',!!hot);}
function counts(){var s=L_sin();setN('n-inicio',s.length,s.some(function(t){return sem(t)==='venc';}));
  var c=L_conf(),man=addD(today(),1);setN('n-confirmar',c.length,c.some(function(t){return t.fecha<=man;}));
  setN('n-repuesto',L_rep().length);setN('n-fletes',L_fle().filter(function(t){return t.estado==='pendiente';}).length);
  var f=L_fue().filter(function(t){return t.estado==='pendiente';});setN('n-fuera',f.length,f.some(function(t){return sem(t)==='venc';}));setN('n-taller',L_tal().length);}
function pasados(){var t0=today(),lim=addD(t0,-45);return turnos().filter(function(t){return t.estado==='asignado'&&t.fecha&&t.fecha<t0&&t.fecha>=lim;});}
function alerts(){var h='';var v=L_sin().concat(L_fue()).filter(function(t){return t.estado==='pendiente'&&sem(t)==='venc';}).length;
  var man=addD(today(),1),c=L_conf().filter(function(t){return t.fecha<=man;}).length,a=pasados().length;
  if(v&&VIEW!=='inicio')h+='<button class="alert red" data-go="inicio"><b>'+v+'</b> '+(v===1?'cliente espera':'clientes esperan')+' día de turno y ya se pasó el plazo.</button>';
  if(c&&VIEW!=='confirmar')h+='<button class="alert amber" data-go="confirmar"><b>'+c+'</b> '+(c===1?'turno de hoy o mañana':'turnos de hoy o mañana')+' sin confirmar. Mandá el WhatsApp o llamalos.</button>';
  if(VIEW==='inicio'&&DB.items.length>12000&&pesoMB()>5)h+='<button class="alert amber" data-go="ajustes"><b>📦</b> La base está pesada ('+pesoMB().toFixed(1)+' MB). Archivá los turnos del año anterior en Ajustes → Archivo anual.</button>';
  if(a)h+='<button class="alert amber" data-go="agenda" data-past="1"><b>'+a+'</b> '+(a===1?'turno de días anteriores':'turnos de días anteriores')+' sin cerrar. Anotá cómo terminó cada visita.</button>';return h;}
function render(){if($('app').hidden)return;counts();var m=$('main'),q=$('q').value.trim();
  if(q.length>=2){m.innerHTML=vBuscar(q);return;}
  m.innerHTML=alerts()+({inicio:vInicio,agenda:vAgenda,confirmar:vConfirmar,repuesto:vRepuesto,fletes:vFletes,fuera:vFuera,taller:vTaller,clientes:vClientes,ajustes:vAjustes}[VIEW])();
  if(VIEW==='inicio')bindInicio();if(VIEW==='ajustes')bindAjustes();if(VIEW==='agenda')bindAgenda();if(VIEW==='clientes')bindClientes();}

/* ---------- Clientes ---------- */
function phones(s){return (String(s||'').match(/\d[\d\s-]{5,}\d/g)||[]).map(function(x){return x.replace(/\D/g,'').slice(-8);}).filter(function(x){return x.length>=7;});}
var FLG=null;
function flagOf(t){if(!FLG)FLG=clientes().filter(function(c){return c.flag;});if(!FLG.length)return null;if(t.clienteId){var c0=byId[t.clienteId];return c0&&c0.flag?c0:null;}
  var ps=phones(t.telefono),r=null;FLG.some(function(c){var cp=phones(c.telefono+' '+(c.tel2||''));if(ps.some(function(p){return cp.indexOf(p)>=0;})){r=c;return true;}return false;});return r;}
function flagTag(c){return c&&c.flag?'<span class="flag '+c.flag+'" title="'+esc(c.motivo||'')+'">'+(c.flag==='no'?'⛔ NO ATENDER':'⚠ COMPLICADO')+'</span>':'';}
function visitasDe(c){var v=(c.hist||[]).map(function(h){return {f:h.f,t:h.t,o:h.o,tp:TIPO[h.tp]||h.tp||'',p:h.p,fa:h.fa,r:h.r,sol:h.sol||null,viejo:true};});
  turnos().forEach(function(t){if(t.clienteId===c.id)v.push({f:t.fecha||t.alta,t:t.tecnico,o:[t.ordenFab,t.ordenTS].filter(Boolean).join(' / '),tp:TIPO[t.tipo]||'',p:[t.producto,t.marca].filter(Boolean).join(' '),fa:t.falla,r:t.resultado,sol:t.sol,estado:t.estado,id:t.id});});
  return v.sort(function(a,b){return (b.f||'')>(a.f||'')?1:-1;});}
function resumenCli(c){var v=visitasDe(c),hechas=v.filter(function(x){return x.viejo||x.estado==='hecho';}),u=hechas[0];
  var txt=hechas.length?'Fuimos <b>'+hechas.length+(hechas.length===1?' vez':' veces')+'</b> · última: '+ddy(u.f)+' '+esc(u.p||'')+(u.sol?' · '+SOL[u.sol]:u.r?' — '+esc(u.r):''):'Nunca fuimos';
  var abiertos=v.filter(function(x){return x.estado==='pendiente'||x.estado==='asignado'||x.estado==='repuesto';});
  return txt+(abiertos.length?' <span class="pill p-warn">Tiene '+abiertos.length+' turno abierto</span>':'');}
function buscarCli(f){var orden=String(f.orden||'').trim(),dig=String(f.telefono||'').replace(/\D/g,''),n=nk(f.nombre),dm=nk(f.domicilio),tx=nk(f.txt),d8=dig.slice(-8),hits=[];
  if(orden.length<2&&dig.length<6&&n.length<3&&dm.length<5&&tx.length<3)return [];
  clientes().forEach(function(c){var pts=0;
    if(d8.length>=6&&phones(c.telefono+' '+(c.tel2||'')).some(function(p){return p.indexOf(d8)>=0||d8.indexOf(p)>=0;}))pts+=6;

  o.querySelector('#okGo').onclick=function(){closeM();go('confirmar');};o.querySelector('#waGo').onclick=function(){enviarConf(t);closeM();};}

/* ---------- Ficha del turno ---------- */
function verTurno(t){var fl=flagOf(t);var r=function(k,v){return v?'<div><b class="k">'+k+'</b> '+v+'</div>':'';};
  var b=(fl?'<div class="tip bad">'+(fl.flag==='no'?'⛔ CLIENTE MARCADO “NO ATENDER”':'⚠ Cliente complicado')+(fl.motivo?': '+esc(fl.motivo):'')+'</div>':'')+(t.clienteId&&byId[t.clienteId]?urgTip(byId[t.clienteId]):'')+
    '<div class="resumen">'+r('Estado',t.estado==='pendiente'?'<b>Espera día</b> · '+plazoCorto(t):t.estado==='asignado'?'<b>Turno '+fL(t.fecha)+'</b> con '+esc(t.tecnico)+' · '+confCell(t):t.estado==='repuesto'?'<b>Espera repuesto</b>':'<b>✔ Hecho '+fL(t.fecha)+'</b> · '+esc(t.tecnico)+(t.sol?' · '+SOL[t.sol]:''))+
      r('Cliente',esc(t.nombre)+(t.clienteId?' <button class="btn btn-sm" data-vcli="1">Ver ficha e historial</button>':''))+r('Teléfono',telLink(t))+r('Domicilio',esc(t.domicilio)+(t.ref?' · '+esc(t.ref):'')+(t.zona?' · <b>'+esc(t.zona)+'</b>':''))+
      r('Tipo',tipoCell(t))+r('Órdenes',esc([t.ordenFab?'Fábrica '+t.ordenFab:'',t.ordenTS?'TS '+t.ordenTS:''].filter(Boolean).join(' · ')))+r('Equipo',esc([PRODN[t.producto]||t.producto,t.marca,t.modelo,t.nfab?'N° '+t.nfab:''].filter(Boolean).join(' · ')))+
      r('Falla',esc(fallaTxt(t)))+r('Detalle',esc([t.desde?'Desde: '+t.desde:'',t.donde?'Instalado en: '+t.donde:'',t.error?'Código: '+t.error:'',t.otroTec==='Sí'?'Ya lo vio otro técnico':''].filter(Boolean).join(' · ')))+r('Atendió',esc([t.atendio,t.canal,t.alta?ddy(t.alta):''].filter(Boolean).join(' · ')))+'</div>'+
    '<div class="g2"><label class="f"><span>N° orden fábrica</span><input class="i" id="e-ordenFab" value="'+esc(t.ordenFab||'')+'"></label><label class="f"><span>N° orden TS</span><input class="i" id="e-ordenTS" value="'+esc(t.ordenTS||'')+'"></label></div>'+
    '<label class="f"><span>Falla</span><input class="i" id="e-falla" value="'+esc(t.falla||'')+'"></label>'+
    '<label class="f"><span>Nota interna</span><input class="i" id="e-nota" value="'+esc(t.nota||'')+'"></label>'+
    '<label class="f"><span>Resultado / qué se hizo</span><input class="i" id="e-resultado" value="'+esc(t.resultado||'')+'"></label>'+
    (t.estado==='repuesto'||t.rep?repForm(t):'')+
    (t.estado==='pendiente'||t.estado==='repuesto'?tecPrefBox(t):'');
  var f='<span class="left"><button class="btn btn-danger" data-a="del">Borrar</button>'+(t.estado==='asignado'?'<button class="btn" data-a="unasg">Sacar el día</button>':'')+(t.estado!=='pendiente'&&t.estado!=='repuesto'?'':'')+'</span>'+
    (t.estado==='asignado'?'<button class="btn btn-wa" data-a="wa">📲 Confirmación</button>'+(t.conf!=='confirmada'?'<button class="btn" data-a="confok">✔ Confirmó</button>':'')+'<button class="btn" data-a="asg">Cambiar día</button><button class="btn btn-green" data-a="cerrar">¿Cómo terminó?</button>':'')+
    (t.estado==='pendiente'?'<button class="btn btn-green" data-a="asg">Dar día</button>':'')+(t.estado==='hecho'?'<button class="btn" data-a="reabrir">Reabrir</button>':'')+'<button class="btn btn-primary btn-big" data-a="save">Guardar</button>';
  var o=modal('Turno · '+esc(t.nombre),b,f);bindOpts(o);
  var bc=o.querySelector('[data-vcli]');if(bc)bc.onclick=function(){var c=byId[t.clienteId];if(c)verCliente(c);};
  function leer(){['ordenFab','ordenTS','falla','nota','resultado'].forEach(function(k){t[k]=o.querySelector('#e-'+k).value.trim();});repLeer(o,t);var tp=o.querySelector('#e-tecPref');if(tp)t.tecPref=tp.value;touch(t);}
  o.querySelector('.md-f').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
    if(a==='del'){if(!confirm('¿Borrar este turno de '+t.nombre+'? No se puede deshacer.'))return;drop(t);closeM();toast('Borrado');return;}
    leer();
    if(a==='save'){closeM();toast('Guardado');}
    else if(a==='asg'){asignar(t);}
    else if(a==='cerrar'){cerrar(t);}
    else if(a==='wa'){enviarConf(t);closeM();}
    else if(a==='confok'){t.conf='confirmada';touch(t);closeM();toast('Turno confirmado ✔');}
    else if(a==='unasg'){t.estado='pendiente';t.tecnico='';t.fecha='';t.conf='';touch(t);closeM();toast('Volvió a “Esperan día”');}
    else if(a==='reabrir'){t.estado='asignado';t.sol='';touch(t);closeM();toast('Reabierto');}};}

function tecPrefBox(t){var ts=DB.cfg.tecnicos;return '<label class="f" style="max-width:360px"><span>Técnico que lo vio / presupuestó <small>(vuelve él por defecto)</small></span><select class="i" id="e-tecPref"><option value="">— Ninguno —</option>'+ts.map(function(n){return '<option'+(n===t.tecPref?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></label>';}
// técnico que presupuestó el último trabajo del cliente (para ACEPTADO cargado por teléfono)
function tecPresu(cliId){var r='';turnos().filter(function(t){return t.clienteId===cliId&&t.estado==='hecho'&&t.tecnico&&(t.sol==='presu'||t.sol==='acepto'||t.sol==='repuesto'||t.sol==='volver');}).sort(function(a,b){return (b.fecha||'')>(a.fecha||'')?1:-1;}).slice(0,1).forEach(function(t){r=t.tecnico;});return r;}

/* ---------- Cerrar visita ---------- */
function cerrar(t){var fle=!!t.flete,ent=t.flete==='entrega';
  var lst=fle?[[ent?'entregado':'retirado',SOL[ent?'entregado':'retirado']+'<small>'+(ent?'el equipo volvió al cliente':'el equipo entra al Taller')+'</small>'],['rep_nos','🔁 Se reprograma<small>por un problema nuestro</small>'],['rep_cli','🔁 Se reprograma<small>por un problema del cliente</small>'],['externo',SOL.externo+'<small>lo gestiona el cliente, no hacemos nada</small>']]:
    SOL_VISITA.map(function(k){return [k,SOL[k]+'<small>'+{ok:'listo, no hay que volver',volver:'se crea otro turno',presu:'esperamos respuesta del cliente',acepto:'se crea turno ACEPTADO',repuesto:'va a “Esperan repuesto”',taller:'nueva orden TS, se repara en taller',ausente:'vuelve a “Esperan día”'}[k]+'</small>'];});
  var o=modal(fle?'¿Cómo terminó el flete?':'¿Cómo terminó la visita?','<div class="tip"><b>'+esc(t.nombre)+'</b> · '+esc([PRODN[t.producto]||t.producto,t.marca].filter(Boolean).join(' '))+' · '+fL(t.fecha)+' con '+esc(t.tecnico)+'</div>'+
  opts('sol',lst,'','wide ')+'<label class="f"><span>'+(fle?'Nota (opcional)':'¿Qué se hizo / qué tiene el equipo?')+'</span><textarea class="i" id="s-res">'+esc(t.resultado||'')+'</textarea></label><div id="s-rep"></div>','<button class="btn" data-a="x">Cancelar</button><button class="btn btn-primary btn-big" data-a="ok">Guardar</button>');
  bindOpts(o,function(n,v){if(n!=='sol')return;var bx=o.querySelector('#s-rep');bx.innerHTML=v==='repuesto'?repForm(t):'';bindOpts(bx);});
  o.querySelector('.md-f').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='x')return closeM();var s=ov(o,'sol'),res=o.querySelector('#s-res').value.trim();if(!s){toast('Elegí cómo terminó');return;}
    t.resultado=res;var copia=function(extra){var n=JSON.parse(JSON.stringify(t));Object.assign(n,{id:uid(),estado:'pendiente',tecnico:'',tecPref:t.tecnico||t.tecPref||'',fecha:'',conf:'',sol:'',resultado:'',alta:today(),ingreso:today(),origenId:t.id,canal:'Seguimiento',atendio:YO||t.atendio,flete:'',fleteMonto:0,rep:null},extra);delete n.v;delete n.mod;return n;};
    if(s==='ausente'||s==='rep_nos'||s==='rep_cli'){var why=s==='ausente'?'No estaba el ':s==='rep_nos'?'Reprogramado (problema nuestro) el ':'Reprogramado (problema del cliente) el ';
      t.estado='pendiente';t.nota=((t.nota||'')+' · '+why+dd(t.fecha)+(res?': '+res:'')).replace(/^ · /,'');t.tecnico='';t.fecha='';t.conf='';touch(t);closeM();toast('Vuelve a esperar día');return;}
    t.estado='hecho';t.sol=s;touch(t);
    if(s==='retirado'||s==='externo'){touch({id:uid(),kind:'taller',orden:t.ordenTS||'',equipo:[t.producto,t.marca].filter(Boolean).join(' '),cliente:t.nombre,clienteId:t.clienteId||'',telefono:t.telefono||'',falla:fallaTxt(t),tecnico:'',fecha:'',ingreso:today(),estado:'esperando',nota:s==='retirado'?'Retirado por flete':'Lo trae un flete externo del cliente'});closeM();toast(s==='retirado'?'Retiro hecho. El equipo quedó en Taller.':'Anotado: flete externo. Queda en Taller esperando el equipo.');return;}
    if(s==='volver'){touch(copia({nota:'Volver: '+res}));toast('Hecho. Se creó otro turno para volver.');}
    else if(s==='acepto'){touch(copia({tipo:'AC',nota:'Aceptó presupuesto: '+res}));toast('Hecho. Se creó el turno ACEPTADO.');}
    else if(s==='repuesto'){var tmpR={};repLeer(o,tmpR);touch(copia({estado:'repuesto',nota:'Repuesto: '+res,rep:tmpR.rep||null}));toast('Hecho. Quedó en “Esperan repuesto”.');}
    else if(s==='taller'){closeM();aTaller(t,'esperando');return;}
    else toast(fle?'Flete cerrado ✔':'Visita cerrada ✔');closeM();};}
// Pasar un turno al taller con una orden TS nueva (repara en taller)
function aTaller(t,estado){editTaller(null,{tecnico:t.tecPref||t.tecnico||'',orden:'',equipo:[t.producto,t.marca].filter(Boolean).join(' '),cliente:t.nombre,clienteId:t.clienteId||'',telefono:t.telefono||'',falla:fallaTxt(t),estado:estado||'esperando',nota:'Viene de la visita del '+dd(t.fecha||t.alta)+(t.resultado?': '+t.resultado:'')},
  function(){if(t.estado!=='hecho'||t.sol!=='taller'){t.estado='hecho';t.sol='taller';touch(t);}toast('Pasó al taller con la orden nueva');},true);}

/* ---------- Dar / cambiar día ---------- */
function asignar(t){if(!t)return;var tal=t.kind==='taller';var ts0=tecsPara(t,tal);var pref=!tal&&t.tecPref&&ts0.indexOf(t.tecPref)>=0?t.tecPref:'';var sel={tec:t.tecnico&&ts0.indexOf(t.tecnico)>=0?t.tecnico:'',dia:t.fecha&&t.fecha>=today()?t.fecha:'',pref:pref,otro:!!(t.tecnico&&pref&&t.tecnico!==pref)};var p=tal?'':plazo(t);var fl=tal?null:flagOf(t);
  var esp=function(n){return !tal&&lista(DB.cfg.esp[n]).indexOf(t.producto)>=0;};var ts=ts0.slice().sort(function(a,b){return esp(b)-esp(a);});var cli=t.clienteId?byId[t.clienteId]:null;
  var b=(fl?'<div class="tip bad">'+(fl.flag==='no'?'⛔ CLIENTE MARCADO “NO ATENDER”':'⚠ Cliente complicado')+(fl.motivo?': '+esc(fl.motivo):'')+'</div>':'')+(cli?urgTip(cli):'')+
    '<div class="tip"><b>'+esc(tal?'Orden '+(t.orden||''):t.nombre||'')+'</b>'+(tal?(t.equipo?' · '+esc(t.equipo):'')+(t.cliente?' · '+esc(t.cliente):''):' · '+(t.tipo?TIPO[t.tipo]:'')+(t.flete?' · FLETE '+esc(t.flete.toUpperCase()):'')+' · '+esc([PRODN[t.producto]||t.producto,t.marca].filter(Boolean).join(' · '))+'<br>📍 '+esc(t.domicilio||'')+' · <b>'+esc(t.zona||'sin zona')+'</b>')+'</div>'+
    (p&&t.estado==='pendiente'?'<div class="tip '+(diff(today(),p)<0?'bad':'warn')+'">'+(diff(today(),p)<0?'⚠ Ya se pasó el plazo ('+fD(p)+'). Conviene darle el primer día que puedas.':'Plazo sugerido: hasta el <b>'+fL(p)+'</b>.')+'</div>':'')+
    '<div id="pick"></div>';
  var o=modal(tal?'Asignar día de taller':'Dar día',b,'<button class="btn" data-a="x">Cancelar</button><button class="btn btn-green btn-big" data-a="ok">Confirmar</button>');
  function paint(){var box=o.querySelector('#pick');box.innerHTML=picker({ts:ts,esp:esp,sel:sel,pref:pref,p:t.estado==='pendiente'?p:'',zona:tal?'':t.zona,excl:t.id});bindPicker(box,sel,paint);}
  paint();
  o.querySelector('.md-f').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='x')return closeM();
    if(!sel.tec){toast('Tocá el técnico');return;}if(!sel.dia){toast('Tocá un día');return;}
    if(fl&&fl.flag==='no'&&!confirm('Este cliente está marcado “NO ATENDER”. ¿Dar el día igual?'))return;
    var cambio=t.fecha!==sel.dia;t.tecnico=sel.tec;t.fecha=sel.dia;if(!tal){t.estado='asignado';if(cambio)t.conf='';}else if(t.estado==='esperando')t.estado='en_reparacion';touch(t);closeM();
    if(tal){toast('Orden '+(t.orden||'')+' asignada a '+t.tecnico+' para el '+fL(t.fecha));return;}if(t.flete){toast('Flete asignado a '+t.tecnico+' para el '+fL(t.fecha));listo(t);return;}listo(t);};}
function telWA(s){var n=(String(s||'').match(/\d[\d\s-]{6,}\d/)||[''])[0].replace(/\D/g,'');if(n.indexOf('549')!==0){n=n.replace(/^0/,'');n='549'+n.replace(/^(\d{2,4})15/,'$1');}return n;}
function enviarConf(t){var tpl=t.tipo==='SG'?DB.cfg.msgSG:DB.cfg.msgGT,h=new Date().getHours();
  var m=tpl.replace(/\{SALUDO\}/g,h<13?'Buenos días':'Buenas tardes').replace(/\{DIA\}/g,fL(t.fecha)).replace(/\{COSTO\}/g,money(t.visita||DB.cfg.costos[0]));
  window.open('https://wa.me/'+telWA(t.telefono)+'?text='+encodeURIComponent(m),'_blank','noopener');if(t.conf!=='confirmada'){t.conf='enviada';touch(t);}render();toast('Confirmación abierta en WhatsApp. Cuando responda, tocá “✔ Confirmó”.',5000);}

/* ---------- Taller: cargar / editar ---------- */
function editTaller(t,pre,cb,ordenReq){var nuevo=!t;t=t?JSON.parse(JSON.stringify(t)):Object.assign({id:uid(),kind:'taller',orden:'',equipo:'',cliente:'',clienteId:'',telefono:'',tecnico:'',fecha:'',ingreso:today(),estado:'esperando',nota:''},pre||{});
  var b=(nuevo&&!t.clienteId?'<label class="f buscar"><span>🔎 Buscá primero si el cliente ya está en la base (nombre, dirección, teléfono o código TS)</span><input class="i" id="t-q" autocomplete="off"></label><div id="t-res" class="hres"></div>':'')+
    (t.clienteId&&byId[t.clienteId]?'<div class="tip good">✔ Cliente de la base: <b>'+esc(byId[t.clienteId].nombre)+'</b></div>'+urgTip(byId[t.clienteId]):'')+
    '<div class="g3"><label class="f'+(ordenReq?' req':'')+'"><span>N° de orden TS'+(ordenReq?' nueva (ingreso a taller)':'')+'</span><input class="i" id="t-orden" inputmode="numeric" value="'+esc(t.orden)+'"></label><label class="f"><span>Equipo</span><input class="i" id="t-equipo" value="'+esc(t.equipo||'')+'"></label><label class="f"><span>Entró al taller</span><input class="i" type="date" id="t-ingreso" value="'+esc(t.ingreso||'')+'"></label></div>'+
    '<div class="g2"><label class="f"><span>Cliente</span><input class="i" id="t-cliente" value="'+esc(t.cliente||'')+'"></label><label class="f"><span>Teléfono</span><input class="i" id="t-telefono" inputmode="tel" value="'+esc(t.telefono||'')+'"></label></div><label class="f"><span>Falla</span><input class="i" id="t-falla" value="'+esc(t.falla||'')+'"></label>'+
    '<div class="step"><div class="q">Estado</div>'+opts('est',Object.keys(TST).map(function(k){return [k,TST[k]];}),t.estado,'')+'</div>'+
    '<div class="g2"><label class="f"><span>Técnico que lo repara'+(t.tecnico?' <small>(por defecto el que lo vio; cambialo si no puede)</small>':'')+'</span><select class="i" id="t-tec"><option value="">— Sin asignar —</option>'+DB.cfg.tecnicos.map(function(n){return '<option'+(n===t.tecnico?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></label><label class="f"><span>Día que lo repara</span><input class="i" type="date" id="t-fecha" value="'+esc(t.fecha||'')+'"></label></div>'+
    '<label class="f"><span>Nota</span><textarea class="i" id="t-nota">'+esc(t.nota||'')+'</textarea></label>';
  var o=modal(nuevo?'Orden al taller':'Taller · orden '+esc(t.orden),b,(nuevo?'':'<span class="left"><button class="btn btn-danger" data-a="del">Borrar</button></span>')+'<button class="btn" data-a="x">Cancelar</button><button class="btn btn-primary btn-big" data-a="save">Guardar</button>');bindOpts(o);
  var tq=o.querySelector('#t-q'),tr=o.querySelector('#t-res'),found=[],tm;
  if(tq){tq.oninput=function(){clearTimeout(tm);tm=setTimeout(function(){var v=tq.value.trim(),dig=v.replace(/[\s-]/g,'');found=buscarCli(/^\d+$/.test(dig)?{telefono:dig,orden:dig}:{txt:v});
      tr.innerHTML=(dig.length>=2||v.length>=3)?(found.length?found.map(function(c,i){return cliCard(c,'<button type="button" class="btn btn-sm btn-primary" data-tu="'+i+'">Usar este cliente</button>');}).join(''):'<div class="tip">No está en la base: completá los datos abajo y se agrega solo.</div>'):'';},250);};
    tr.onclick=function(e){var x=e.target.closest('[data-tu]');if(!x)return;var c=found[+x.dataset.tu];t.clienteId=c.id;o.querySelector('#t-cliente').value=c.nombre||'';o.querySelector('#t-telefono').value=c.telefono||'';

  o.querySelector('.md-f').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;if(a==='x')return closeM();
    if(a==='del'){if(!confirm('¿Borrar la orden '+t.orden+' del taller?'))return;drop(byId[t.id]);closeM();return;}
    ['orden','equipo','cliente','telefono','ingreso','fecha','nota','falla'].forEach(function(k){t[k]=o.querySelector('#t-'+k).value.trim();});t.tecnico=o.querySelector('#t-tec').value;t.estado=ov(o,'est')||'esperando';
    if(!t.orden&&!t.cliente){toast('Poné el N° de orden o el cliente');return;}
    if(!t.clienteId&&t.cliente){var cn={id:uid(),kind:'cliente',nombre:t.cliente,telefono:t.telefono||'',alta:today()};touch(cn);t.clienteId=cn.id;}
    var cur=byId[t.id];if(cur){Object.assign(cur,t);touch(cur);}else touch(t);closeM();toast('Guardado');if(cb)cb(t);};}

      return '<tr><td>'+(TIPO[t.tipo]||'')+(t.tipo==='SG'&&t.visita?' '+money(t.visita):'')+(t.flete?' · '+t.flete.toUpperCase():'')+'</td><td>'+esc([t.ordenFab,t.ordenTS].filter(Boolean).join(' / '))+'</td><td>'+esc(t.nombre)+'</td><td>'+esc(t.domicilio)+(t.ref?' ('+esc(t.ref)+')':'')+'</td><td>'+esc(t.zona||'')+'</td><td>'+esc(t.telefono)+'</td><td>'+esc([t.producto,t.marca,t.modelo].filter(Boolean).join(' '))+'</td><td>'+esc(fallaTxt(t))+'</td><td>'+esc(t.nota||'')+'</td><td>'+esc(t.resultado||'')+'</td></tr>';}).join('')+'</tbody></table>';});
  $('print').innerHTML=h;setTimeout(function(){window.print();},50);}
