<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turnos VILLGUZ</title>
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Turnos: la planilla de siempre, pero que avisa. Filas horizontales como en Excel, botones grandes y colores que marcan lo urgente. */
:root{
  --navy:#003370;--navy-deep:#00224D;--green:#76B72A;--green-ink:#4E8A14;
  --ink:#0C1624;--muted:#56657A;--paper:#fff;--mist:#EEF3F8;--line:#D6DFEA;--grid:#C9D4E2;
  --red:#B3261E;--red-bg:#FFF0EE;--amber:#8A5A00;--amber-bg:#FFF6DD;--ok-bg:#F1F8E8;--violet:#5B2A86;--violet-bg:#F4ECFC;--orange:#A64B00;--orange-bg:#FFEBDC;
  --f-display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--mist);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
a{color:var(--navy)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:2px solid var(--line);border-radius:12px;padding:.6em 1.05em;font-weight:700;cursor:pointer;background:#fff;text-decoration:none;white-space:nowrap;min-height:44px;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:#00418f}
.btn-green{background:var(--green);color:#00224D;border-color:var(--green)}
.btn-green:hover{background:#86c63a;border-color:#86c63a}
.btn-danger{color:var(--red);border-color:#F0C4C0}
.btn-wa{background:#25D366;border-color:#25D366;color:#063}
.btn-sm{min-height:34px;padding:.3em .75em;font-size:.85rem;border-radius:10px}
.btn-big{min-height:56px;font-size:1.05rem;padding:.7em 1.4em}
label.f{display:grid;gap:5px;font-size:.85rem;font-weight:700;color:var(--navy)}
label.f small{font-weight:500;color:var(--muted)}
.i{width:100%;border:2px solid var(--line);border-radius:10px;padding:.55em .75em;background:#F7F9FC;font-weight:500;min-height:46px}
textarea.i{min-height:70px;resize:vertical}
.i:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(118,183,42,.22)}
.err{color:var(--red);font-weight:700;font-size:.92rem;margin:0}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:30px;width:min(420px,100%);display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .logo{width:180px;color:var(--ink)}
.login-card h1{font-size:2.4rem;color:var(--navy)}
.login-card p{margin:0;color:var(--muted)}

/* Barra superior */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.top-in{max-width:1600px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-btn{background:none;border:0;padding:0;cursor:pointer;color:#fff;display:flex;align-items:center;gap:10px}
.logo-btn svg{width:110px;height:auto;display:block}
.logo-btn span{font-family:var(--f-display);font-size:1.6rem;color:var(--green);line-height:1}
.ingresar{min-height:52px;font-size:1.05rem;padding:.55em 1.3em;letter-spacing:.02em;box-shadow:0 0 0 3px rgba(118,183,42,.35)}
.ingresar b{font-size:1.4rem;line-height:1}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:0;border-radius:999px;padding:.7em 1em .7em 2.6em;font-weight:600;background:rgba(255,255,255,.14);color:#fff;min-height:46px}
.search input::placeholder{color:#C3D2E4}
.search input:focus{outline:none;background:#fff;color:var(--ink)}
.search svg{position:absolute;left:.9em;top:50%;transform:translateY(-50%);width:1.2em;height:1.2em;color:#C3D2E4;pointer-events:none}
.cloud{font-size:.78rem;font-weight:700;padding:.4em .85em;border-radius:999px;white-space:nowrap}
.cs-ok{background:rgba(118,183,42,.22);color:#CFF0A6}.cs-wait{background:rgba(255,255,255,.14);color:#fff}.cs-err{background:var(--red);color:#fff}
.top .btn:not(.btn-green){background:transparent;color:#fff;border-color:rgba(255,255,255,.35);min-height:40px}
.nav{background:#fff;border-bottom:1px solid var(--line)}
.nav-in{max-width:1600px;margin:auto;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.tab{border:2px solid transparent;background:none;border-radius:12px;padding:.5em .95em;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:.45em;min-height:46px}
.tab:hover{background:var(--mist);color:var(--navy)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
.tab .n{background:var(--mist);color:var(--navy);border-radius:999px;padding:.05em .55em;font-size:.82rem;min-width:1.7em;text-align:center}
.tab .n.hot{background:var(--red);color:#fff}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.2);color:#fff}
.tab[aria-selected="true"] .n.hot{background:var(--red)}
@media (max-width:760px){.top-in{gap:8px}.logo-btn svg{width:76px}.logo-btn span{display:none}.cloud{font-size:.64rem;padding:.3em .6em}#logout{padding:.3em .7em}.ingresar{flex:1 1 0;min-width:0;min-height:48px;font-size:.85rem;padding:.4em .5em;overflow:hidden}.search{order:5;flex-basis:100%}.cloud{font-size:0;padding:0;width:14px;height:14px;flex:none}.cs-ok{background:var(--green)}.cs-wait{background:#fff}}

main{max-width:1600px;margin:auto;padding:16px 16px 60px;display:grid;gap:14px}
.alert{border-radius:14px;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid;text-align:left;width:100%;font-size:.98rem}
.alert.red{background:var(--red-bg);border-color:#F0B6B1;color:var(--red)}
.alert.amber{background:var(--amber-bg);border-color:#EED79A;color:var(--amber)}
.alert b{font-size:1.5rem;font-family:var(--f-display);font-weight:400}
.vh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.vh h2{font-size:2.1rem;color:var(--navy)}
.vh p{margin:4px 0 0;color:var(--muted);max-width:80ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.4em .95em;font-weight:700;cursor:pointer;min-height:40px;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.empty{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted);font-weight:600}
.sect{font-family:var(--f-display);font-size:1.6rem;color:var(--navy);margin:6px 0 -6px}

/* Planilla (tabla tipo Excel) */
.xl-wrap{background:#fff;border:1px solid var(--grid);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px)}
table.xl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:.84rem;line-height:1.3}
.xl th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;font-weight:700;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:8px 8px;white-space:nowrap;border-right:1px solid #1C4C86}
.xl td{padding:6px 8px;border-bottom:1px solid var(--grid);border-right:1px solid #E3E9F1;vertical-align:top;background:#fff}
.xl tbody tr{cursor:pointer}
.xl tbody tr:nth-child(even) td{background:#F8FAFD}
.xl tbody tr:hover td{background:#EAF2FB}
.xl td.nm{font-weight:700;min-width:150px}
.xl td.dom{min-width:190px;max-width:260px}
.xl td.fa{min-width:150px;max-width:220px}
.xl td.res{min-width:150px;max-width:240px;color:#2B3A4E}
.xl td.ord{font-weight:700;max-width:130px;word-break:break-word}
.xl td.nw{white-space:nowrap}
.xl .act{display:flex;flex-direction:column;gap:4px;margin-top:6px}.xl .act:empty{display:none}
.xl td.lead{white-space:nowrap;font-weight:800;font-size:.76rem;border-left:6px solid var(--line)}
.xl tr.venc td.lead{border-left-color:var(--red);color:var(--red);background:var(--red-bg)!important}
.xl tr.hoy td.lead{border-left-color:#E0A100;color:var(--amber);background:var(--amber-bg)!important}
.xl tr.ok td.lead{border-left-color:var(--green);color:var(--green-ink)}
.xl tr.sin td.lead{color:var(--muted)}
.xl tr.done td{color:#6B7A8E}
.xl tr.done td.lead{border-left-color:#9AA7B6}
.xl tr.ask td.lead{border-left-color:#E0A100;background:var(--amber-bg)!important;color:var(--amber)}
.xl tr.no td{background:#FFF3F2!important}
.xl tr.day td{background:#E3F3D0!important;font-weight:800;color:var(--navy);cursor:default;font-size:.88rem;text-transform:capitalize;border-bottom:1px solid #BFDDA0}
.xl tr.day.today td{background:#C9E8A6!important}
.xl tr.day td .dnote{background:var(--violet);color:#fff;border-radius:6px;padding:.1em .5em;margin-left:8px;text-transform:none;font-size:.78rem}
.xl tr.day td .btn{margin-left:8px}
.xl tr.tal td{background:var(--violet-bg)!important}
.xl tr.empty-day td{color:var(--muted);font-style:italic;cursor:default;background:#fff!important}
.xl .btn-sm{min-height:32px}
.tel{font-weight:700;text-decoration:none;color:var(--navy);white-space:nowrap}
.flag{display:inline-block;font-size:.7rem;font-weight:800;padding:.1em .45em;border-radius:6px;margin-right:4px;vertical-align:1px}
.flag.complicado{background:var(--amber-bg);color:var(--amber);border:1px solid #EED79A}
.flag.no{background:var(--red);color:#fff}
.pill{display:inline-block;padding:.15em .55em;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap;letter-spacing:.02em}
.p-SG{background:#E3ECF8;color:var(--navy)}
.p-GT{background:#E3F3D0;color:var(--green-ink)}
.p-GTT{background:var(--violet-bg);color:var(--violet)}
.p-AC{background:var(--orange-bg);color:var(--orange)}
.p-x{background:var(--mist);color:var(--muted)}
.p-fl{background:#FFE9D6;color:#8A3B00}
.p-fz{background:#E0F2F1;color:#0B5E57}
.p-ok{background:var(--ok-bg);color:var(--green-ink)}
.p-tal{background:var(--violet-bg);color:var(--violet)}

/* Agenda semanal */
.wk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wk-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--navy);font-weight:700}
.wk-lbl{font-family:var(--f-display);font-size:1.6rem;color:var(--navy);min-width:220px}
.ag-tec{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ag-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--navy);color:#fff;flex-wrap:wrap}
.ag-h h3{font-size:1.8rem}
.ag-h .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.ag-days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.ag-day{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.ag-day:last-child{border-right:0}
.ag-dh{padding:7px 9px;background:var(--mist);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.ag-dh b{font-size:.92rem}
.ag-dh .cnt{font-size:.78rem;font-weight:700;color:var(--muted)}
.ag-day.today .ag-dh{background:#E3F3D0}
.ag-day.today .ag-dh b::after{content:" · HOY";color:var(--green-ink)}
.ag-cell{padding:7px;display:grid;gap:6px;align-content:start;flex:1;min-height:80px}
.dnote-c{background:var(--violet);color:#fff;border-radius:8px;padding:5px 8px;font-weight:800;font-size:.78rem;cursor:pointer;border:0;text-align:left}
.mini{border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:6px 8px;background:#fff;cursor:pointer;display:grid;gap:2px;text-align:left;width:100%;font-size:.82rem;line-height:1.3}
.mini:hover{border-color:var(--navy)}
.mini b{font-size:.87rem;word-break:break-word}
.mini .sub{color:var(--muted);word-break:break-word}
.mini.GT{border-left-color:var(--green)}.mini.GTT{border-left-color:var(--violet)}.mini.SG{border-left-color:var(--navy)}.mini.AC{border-left-color:var(--orange)}
.mini.done{background:#F7F9FC;opacity:.75}
.mini.ask{border-color:#EED79A;background:var(--amber-bg)}
.mini.tal{border-left-color:var(--violet);background:var(--violet-bg)}
.ask-row{display:flex;gap:6px;margin-top:4px}
.ask-row .btn{flex:1;min-height:32px;padding:.2em .4em;font-size:.78rem}
@media (max-width:1000px){.ag-days{grid-template-columns:1fr}.ag-day{border-right:0;border-bottom:1px solid var(--line)}.ag-cell{min-height:0}.ag-cell:empty::after{content:"Sin turnos";color:var(--muted);font-size:.85rem}}

/* Taller */
.tl-st{display:flex;gap:4px;flex-wrap:wrap}
.st{border:2px solid var(--line);background:#fff;border-radius:8px;padding:.15em .5em;font-weight:700;font-size:.75rem;cursor:pointer;min-height:30px}
.st.on{color:#fff}
.st.on[data-s="esperando"]{background:#56657A;border-color:#56657A}
.st.on[data-s="en_reparacion"]{background:var(--navy);border-color:var(--navy)}
.st.on[data-s="repuesto"]{background:#C07A00;border-color:#C07A00}
.st.on[data-s="listo"]{background:var(--green-ink);border-color:var(--green-ink)}
.st.on[data-s="entregado"]{background:#9AA7B6;border-color:#9AA7B6}

/* Ventana (modal) */
.ov{position:fixed;inset:0;background:rgba(0,20,45,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}
.md{background:#fff;border-radius:20px;width:min(820px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column}
.md-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.md-h h2{font-size:2rem;color:var(--navy)}
.md-x{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.5rem;cursor:pointer;flex:none}
.md-b{padding:16px 20px;display:grid;gap:16px}
.md-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 20px 20px}
.md-f .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.ov{padding:0}.md{border-radius:0;min-height:100%}.md-f{border-radius:0}.md-f .btn{flex:1}}
.g2{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.step{display:grid;gap:8px}
.step>.q{font-weight:800;color:var(--navy);font-size:1rem}
.step>.q span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:.9rem;margin-right:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:.5em 1em;font-weight:800;cursor:pointer;min-height:50px;display:grid;justify-items:center;line-height:1.15;color:var(--ink)}
.opt small{font-weight:600;color:var(--muted);font-size:.72rem}
.opt:hover{border-color:var(--navy)}
.opt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.on small{color:#C9D7E8}
.opt.tGT.on{background:var(--green-ink);border-color:var(--green-ink)}.opt.tGTT.on{background:var(--violet);border-color:var(--violet)}.opt.tAC.on{background:var(--orange);border-color:var(--orange)}
.opt.fcomplicado.on{background:#C07A00;border-color:#C07A00}.opt.fno.on{background:var(--red);border-color:var(--red)}
.opt.late{border-color:#EED79A;background:var(--amber-bg)}
.opt.late.on{background:#C07A00;border-color:#C07A00}
.opt.wide{flex:1;min-width:120px}
.days-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.tip{background:var(--mist);border-radius:12px;padding:10px 14px;font-size:.92rem}
.tip.warn{background:var(--amber-bg);color:var(--amber);font-weight:700}
.tip.bad{background:var(--red-bg);color:var(--red);font-weight:700;border:2px solid #F0B6B1}
/* Ya es cliente */
.hist{border:2px solid #BFDDA0;background:var(--ok-bg);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.hist h4{margin:0;font-size:.95rem;color:var(--green-ink)}
.hc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.hc.no{border:2px solid var(--red);background:#FFF6F5}
.hc.complicado{border:2px solid #E0B44C}
.hc-top{display:flex;justify-content:space-between;gap:8px;align-items:start;flex-wrap:wrap}
.hc-top b{font-size:1rem}
.hc ul{margin:0;padding-left:18px;font-size:.84rem;color:#2B3A4E}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.8em 1.3em;border-radius:14px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.card h3{font-size:1.7rem;color:var(--navy)}
.tecrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tecrow .i{flex:1;min-width:160px}

/* Impresión */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:10px}
  #app,#login,.ov,.toast{display:none!important}
  #print{display:block}
  .pr-h{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #003370;padding-bottom:6px;margin-bottom:8px}
  .pr-h svg{width:110px;color:#0C1624}
  .pr-h h1{font-size:26px;color:#003370}
  .pr-day{font-weight:700;font-size:13px;margin:10px 0 4px;color:#003370;text-transform:capitalize}
  .pr-t{width:100%;border-collapse:collapse}
  .pr-t th,.pr-t td{border:1px solid #99A;padding:3px 4px;text-align:left;vertical-align:top}
  .pr-t th{background:#E3ECF8;font-size:9px}
  .pr-t tr{page-break-inside:avoid}
}
</style>

function fL(s){return s?DL[dow(s)]+' '+dd(s):'';}

/* ---------- Reglas de plazo ----------
   S/G: turno dentro de la misma semana en que entró (hasta el viernes).
   GTIA, GTIA TALLER y ACEPTADO: como mucho hasta el viernes de la semana siguiente.
   Si entra sábado o domingo, cuenta desde la semana que empieza. */
var TIPO={SG:'S/G',GT:'GTIA',GTT:'GTIA TALLER',AC:'ACEPTADO'};
function base(t){return t.ingreso||t.alta||'';}
function plazo(t){var b=base(t);if(!b)return '';var m=monday(b);if(dow(b)===6||dow(b)===0)m=addD(m,7);return addD(m,t.tipo==='SG'?4:11);}
function sem(t){var p=plazo(t);if(!p)return 'sin';var d=diff(today(),p);return d<0?'venc':d<=1?'hoy':'ok';}
function plazoCorto(t){var p=plazo(t);if(!p)return 'Sin fecha';var d=diff(today(),p);if(d<0)return 'VENCIDO '+(-d)+'d';if(d===0)return 'HOY';if(d===1)return 'Mañana';return 'hasta '+fD(p);}

/* ---------- Datos ---------- */
function norm(){DB.cfg=DB.cfg||{};DB.cfg.tecnicos=DB.cfg.tecnicos||[];DB.cfg.inactivos=DB.cfg.inactivos||[];DB.items=DB.items||[];index();}
function index(){byId={};DB.items.forEach(function(it){byId[it.id]=it;});CIX=null;FLG=null;}
function tecs(){return DB.cfg.tecnicos.filter(function(n){return DB.cfg.inactivos.indexOf(n)<0;});}
function turnos(){return DB.items.filter(function(t){return t.kind==='turno'&&t.estado!=='cancelado';});}
function L_sin(){return turnos().filter(function(t){return t.estado==='pendiente'&&!t.flete&&t.zona!=='fuera';});}
function L_fle(){return turnos().filter(function(t){return t.flete&&t.estado!=='hecho';});}
function L_fue(){return turnos().filter(function(t){return t.zona==='fuera'&&!t.flete&&t.estado!=='hecho';});}
function L_tal(){return DB.items.filter(function(t){return t.kind==='taller'&&t.estado!=='entregado';});}
function cache(){try{localStorage.setItem(KEY,JSON.stringify({v:CVER,d:DB}));}catch(e){try{localStorage.removeItem(KEY);}catch(x){}}}
function storeQ(){try{localStorage.setItem(QK,JSON.stringify(Q));}catch(e){}}
function qEmpty(){return !Object.keys(Q.ch).length&&!Object.keys(Q.del).length&&!Q.cfg;}
function touch(it){it.mod=Date.now();if(!byId[it.id]){DB.items.push(it);byId[it.id]=it;}Q.ch[it.id]=it;delete Q.del[it.id];CIX=null;FLG=null;storeQ();cache();sched();}
function drop(it){if(!it)return;DB.items=DB.items.filter(function(x){return x.id!==it.id;});delete byId[it.id];delete Q.ch[it.id];Q.del[it.id]=1;CIX=null;FLG=null;storeQ();cache();sched();}
function saveCfg(){Q.cfg=JSON.parse(JSON.stringify(DB.cfg));storeQ();cache();sched();}
function reapply(){Object.keys(Q.ch).forEach(function(id){var it=Q.ch[id];if(byId[id]){DB.items[DB.items.indexOf(byId[id])]=it;}else DB.items.push(it);byId[id]=it;});
  if(Object.keys(Q.del).length)DB.items=DB.items.filter(function(x){return !Q.del[x.id];});if(Q.cfg)DB.cfg=Q.cfg;index();}
function adopt(data){DB=data||{cfg:{},items:[]};delete DB.dels;norm();reapply();cache();render();}
function applyDelta(dl){if(!dl)return;var pos={};DB.items.forEach(function(it,i){pos[it.id]=i;});
  (dl.items||[]).forEach(function(it){if(pos.hasOwnProperty(it.id))DB.items[pos[it.id]]=it;else{pos[it.id]=DB.items.length;DB.items.push(it);}});
  if(dl.dels&&dl.dels.length){var s={};dl.dels.forEach(function(id){s[id]=1;});DB.items=DB.items.filter(function(x){return !s[x.id];});}
  if(dl.cfg)DB.cfg=dl.cfg;norm();reapply();cache();render();}

/* ---------- Drive ---------- */
async function api(action,extra){var r=await fetch(CLOUD,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action,pw:CPW},extra||{})),redirect:'follow'});return r.json();}
function cstat(st,m){var el=$('cloudSt');el.className='cloud cs-'+st;el.textContent=m;}
function sched(){cstat('wait','Guardando…');clearTimeout(pushT);pushT=setTimeout(push,800);}
async function push(){if(!CLOUD||!CPW)return;if(pushing){clearTimeout(pushT);pushT=setTimeout(push,600);return;}
  if(qEmpty()){cstat('ok','Guardado en Drive');return;}
  pushing=true;var snap=Q,have=CVER;Q={ch:{},del:{},cfg:null};
  try{var r=await api('save',{changes:Object.keys(snap.ch).map(function(k){return snap.ch[k];}),deletes:Object.keys(snap.del),cfg:snap.cfg,have:have});
    if(r.ok){CVER=r.version;storeQ();if(r.delta)applyDelta(r.delta);else if(r.data)adopt(r.data);else cache();}
    else{restore(snap);if(r.error==='clave'){cstat('err','La contraseña cambió: volvé a entrar');pushing=false;return;}throw 0;}
  }catch(e){restore(snap);pushing=false;cstat('err','Sin conexión · reintentando');clearTimeout(pushT);pushT=setTimeout(push,6000);return;}
  pushing=false;if(!qEmpty())sched();else cstat('ok','Guardado en Drive');}
function restore(s){Object.keys(s.ch).forEach(function(id){if(!Q.ch[id]&&!Q.del[id])Q.ch[id]=s.ch[id];});Object.keys(s.del).forEach(function(id){Q.del[id]=1;});if(s.cfg&&!Q.cfg)Q.cfg=s.cfg;storeQ();}
async function poll(){if(!CLOUD||!CPW||document.hidden||pushing||!qEmpty())return;
  try{var r=await api('load',{have:CVER});if(!r.ok||r.same)return;CVER=r.version;if(r.delta)applyDelta(r.delta);else if(r.data)adopt(r.data);}catch(e){}}
setInterval(poll,25000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
window.addEventListener('beforeunload',function(e){if(CLOUD&&(!qEmpty()||pushing)){e.preventDefault();e.returnValue='';}});

/* ---------- Ingreso ---------- */
var firstRun=false;
function setupUI(){firstRun=true;$('loginTitle').textContent='Crear contraseña';$('loginSub').textContent='Es la primera vez. Elegí la contraseña de turnos (distinta a la del panel). Sirve en todas las compus y celulares.';$('pw2wrap').hidden=false;$('loginBtn').textContent='Crear y entrar';}
async function login(p,silent){var err=$('loginErr');err.hidden=true;
  $('loginBtn').disabled=true;$('loginBtn').textContent='Conectando…';
  try{CPW=p;
    if(firstRun){if(p.length<6)throw 'Usá al menos 6 letras o números.';if(p!==$('pw2').value)throw 'Las dos contraseñas no son iguales.';var s=await api('setup');if(!s.ok&&s.error!=='ya_configurado')throw 'No se pudo crear la contraseña.';}
    var c=null;try{c=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
    var r=await api('load',{have:c&&c.v||0});
    if(!r.ok){if(r.error==='sin_clave'){setupUI();throw silent?'':'Todavía no hay contraseña: creala abajo.';}if(r.error==='clave')throw 'Contraseña incorrecta.';throw 'No se pudo conectar con Drive ('+r.error+').';}
    try{var q=JSON.parse(localStorage.getItem(QK)||'null');if(q&&q.ch)Q=q;}catch(e){}
    CVER=r.version||0;
    if(r.same&&c){DB=c.d;norm();reapply();}
    else if(r.delta&&c){DB=c.d;norm();applyDelta(r.delta);}
    else{DB=r.data||{cfg:{tecnicos:['Marcelo','Gabi','Jorge']},items:[]};delete DB.dels;norm();reapply();if(!r.data)saveCfg();}
    cache();
    try{sessionStorage.setItem('vt_pw',p);}catch(e){}
    enter();if(!qEmpty())push();else cstat('ok','Guardado en Drive');
  }catch(m){CPW='';if(m){err.textContent=typeof m==='string'?m:'Sin conexión. Revisá internet y probá de nuevo.';err.hidden=false;}}
  $('loginBtn').disabled=false;$('loginBtn').textContent=firstRun?'Crear y entrar':'Ingresar';}
$('loginForm').addEventListener('submit',function(e){e.preventDefault();login($('pw1').value);});
$('logout').addEventListener('click',function(){if(!qEmpty()&&!confirm('Todavía se están guardando cambios. ¿Salir igual?'))return;try{sessionStorage.removeItem('vt_pw');}catch(e){}location.reload();});
var VIEWS=['sin','agenda','fletes','fuera','taller','clientes','ajustes'];
function enter(){$('login').hidden=true;$('app').hidden=false;WK=monday(today());var h=(location.hash||'').slice(1);go(VIEWS.indexOf(h)>=0?h:'sin');}

/* ---------- Navegación ---------- */
function go(v){VIEW=v;$('q').value='';document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v?'true':'false');});try{history.replaceState(null,'','#'+v);}catch(e){}render();window.scrollTo(0,0);}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)go(b.dataset.v);});
$('home').addEventListener('click',function(){go('sin');});
$('nuevo').addEventListener('click',function(){var pre={};if(VIEW==='fletes')pre.flete='retiro';if(VIEW==='fuera')pre.zona='fuera';editTurno(null,pre);});
var qT;$('q').addEventListener('input',function(){clearTimeout(qT);qT=setTimeout(render,200);});

function counts(){var s=L_sin(),f=L_fue();
  $('n-sin').textContent=s.length;$('n-sin').classList.toggle('hot',s.some(function(t){return sem(t)==='venc';}));
  $('n-fletes').textContent=L_fle().filter(function(t){return t.estado==='pendiente';}).length;
  $('n-fuera').textContent=f.filter(function(t){return t.estado==='pendiente';}).length;$('n-fuera').classList.toggle('hot',f.some(function(t){return t.estado==='pendiente'&&sem(t)==='venc';}));
  $('n-taller').textContent=L_tal().length;}
function pasados(){var t0=today(),lim=addD(t0,-45);return turnos().filter(function(t){return t.estado==='asignado'&&t.fecha&&t.fecha<t0&&t.fecha>=lim;});}
function alerts(){var h='';var v=L_sin().concat(L_fue()).filter(function(t){return t.estado==='pendiente'&&sem(t)==='venc';}).length;
  var a=pasados().length;
  if(v&&VIEW!=='sin')h+='<button class="alert red" data-go="sin"><b>'+v+'</b> '+(v===1?'cliente espera':'clientes esperan')+' turno y ya se pasó el plazo. Tocá acá para darles turno.</button>';
  if(a)h+='<button class="alert amber" data-go="agenda" data-past="1"><b>'+a+'</b> '+(a===1?'turno de días anteriores':'turnos de días anteriores')+' sin confirmar. Marcá si se hicieron o reprogramalos.</button>';return h;}

function render(){if($('app').hidden)return;counts();var m=$('main'),q=$('q').value.trim();
  if(q.length>=2){m.innerHTML=vBuscar(q);return;}
  m.innerHTML=alerts()+({sin:vSin,agenda:vAgenda,fletes:vFletes,fuera:vFuera,taller:vTaller,clientes:vClientes,ajustes:vAjustes}[VIEW])();
  if(VIEW==='ajustes')bindAjustes();if(VIEW==='agenda')bindAgenda();if(VIEW==='taller')bindTaller();}

/* ---------- Clientes (historial y marcas) ---------- */
function phones(s){return (String(s||'').match(/\d[\d\s-]{5,}\d/g)||[]).map(function(x){x=x.replace(/\D/g,'');return x.slice(-8);}).filter(function(x){return x.length>=7;});}
function ckey(t){var p=phones(t.telefono);return p.length?'t'+p[0]:'n'+nk(t.nombre);}
var CIX=null;
function cidx(){if(CIX)return CIX;var map={},byPhone={},byName={};
  DB.items.forEach(function(t){if(t.kind!=='turno'||!(t.nombre||t.telefono))return;var ps=phones(t.telefono),n=nk(t.nombre);
    var k=null;ps.some(function(p){if(byPhone[p]){k=byPhone[p];return true;}return false;});if(!k&&n.length>=6&&byName[n])k=byName[n];if(!k)k=ckey(t);
    var c=map[k]||(map[k]={k:k,nombre:'',telefono:'',domicilio:'',visitas:[],ps:{}});
    c.visitas.push(t);ps.forEach(function(p){byPhone[p]=k;c.ps[p]=1;});if(n.length>=6)byName[n]=k;});
  Object.keys(map).forEach(function(k){var c=map[k];c.visitas.sort(function(a,b){return (b.fecha||b.ingreso||'')>(a.fecha||a.ingreso||'')?1:-1;});var u=c.visitas[0];c.nombre=u.nombre||'';c.telefono=u.telefono||'';c.domicilio=u.domicilio||'';
    c.visitas.some(function(v){if(!c.telefono&&v.telefono)c.telefono=v.telefono;if(!c.domicilio&&v.domicilio)c.domicilio=v.domicilio;return false;});});
  CIX={map:map,byPhone:byPhone,byName:byName};return CIX;}
var FLG=null;
function flagOf(t){if(!FLG)FLG=DB.items.filter(function(c){return c.kind==='cliente'&&c.flag;});if(!FLG.length)return null;var ps=phones(t.telefono),n=nk(t.nombre),r=null;
  FLG.some(function(c){var cp=phones(c.telefono);
    if(ps.some(function(p){return cp.indexOf(p)>=0;})||(n.length>=6&&nk(c.nombre)===n)){r=c;return true;}return false;});return r;}
function flagTag(t){var f=flagOf(t);return f?'<span class="flag '+f.flag+'" title="'+esc(f.motivo||'')+'">'+(f.flag==='no'?'⛔ NO ATENDER':'⚠ COMPLICADO')+'</span>':'';}
function buscarClientes(f){var ix=cidx(),hits={},orden=String(f.orden||'').trim(),dig=String(f.telefono||'').replace(/\D/g,''),n=nk(f.nombre),dm=nk(f.domicilio);
  Object.keys(ix.map).forEach(function(k){var c=ix.map[k],pts=0;
    if(orden.length>=4&&c.visitas.some(function(v){return String(v.orden||'').indexOf(orden)>=0;}))pts+=5;
    if(dig.length>=6){var d8=dig.slice(-8);if(Object.keys(c.ps).some(function(p){return p.indexOf(d8)>=0||d8.indexOf(p)>=0;}))pts+=5;}
    if(n.length>=4){var cn=nk(c.nombre);if(n.split(' ').every(function(w){return cn.indexOf(w)>=0;}))pts+=3;}
    if(dm.length>=5&&c.visitas.some(function(v){return nk(v.domicilio).indexOf(dm)>=0;}))pts+=2;
    if(pts)hits[k]=pts;});
  return Object.keys(hits).sort(function(a,b){return hits[b]-hits[a]||((ix.map[b].visitas[0].fecha||'')>(ix.map[a].visitas[0].fecha||'')?1:-1);}).slice(0,5).map(function(k){return ix.map[k];});}
function visitaTxt(v){return '<li><b>'+(v.fecha?ddy(v.fecha):v.ingreso?'ingresó '+ddy(v.ingreso):'sin fecha')+'</b> · '+(v.estado==='pendiente'?'<span style="color:var(--red)">SIN TURNO</span> ':v.estado==='asignado'?'turno ':'')+esc(v.tecnico||'')+' · '+esc([v.producto,v.marca].filter(Boolean).join(' '))+(v.tipo?' · '+TIPO[v.tipo]:'')+(v.orden?' · orden '+esc(v.orden):'')+(v.resultado?' — '+esc(v.resultado):'')+'</li>';}
function histBox(list,selfId){if(!list.length)return '';
  return '<div class="hist"><h4>✔ Ya lo atendimos antes</h4>'+list.map(function(c,i){var fl=flagOf(c);
    var vis=c.visitas.filter(function(v){return v.id!==selfId;});
    return '<div class="hc '+(fl?fl.flag:'')+'"><div class="hc-top"><div>'+(fl?'<span class="flag '+fl.flag+'">'+(fl.flag==='no'?'⛔ NO ATENDER':'⚠ COMPLICADO')+'</span>':'')+'<b>'+esc(c.nombre)+'</b><br><span class="muted">📞 '+esc(c.telefono||'—')+' · 📍 '+esc(c.domicilio||'—')+'</span>'+(fl&&fl.motivo?'<br><b style="color:var(--red)">Motivo: '+esc(fl.motivo)+'</b>':'')+'</div>'+
      (selfId?'':'<button type="button" class="btn btn-sm btn-primary" data-use="'+i+'">Usar estos datos</button>')+'</div>'+
      (vis.length?'<ul>'+vis.slice(0,4).map(visitaTxt).join('')+(vis.length>4?'<li class="muted">… y '+(vis.length-4)+' más</li>':'')+'</ul>':'')+'</div>';}).join('')+'</div>';}

/* ---------- Planilla (tabla) ---------- */
function telLink(t){return t.telefono?'<a class="tel" href="tel:'+esc(String(t.telefono).replace(/[^\d+]/g,'').slice(0,13))+'">'+esc(t.telefono)+'</a>':'';}
function tipoCell(t){return (t.tipo?'<span class="pill p-'+t.tipo+'">'+TIPO[t.tipo]+(t.tipo==='SG'&&t.visita?' '+money(t.visita):'')+'</span>':'')+(extraTipo(t)?'<div class="muted" style="font-size:.74rem">'+esc(t.tipoTxt)+'</div>':'')+
  (t.flete?' <span class="pill p-fl">'+esc(t.flete.toUpperCase())+(t.fleteMonto?' '+money(t.fleteMonto):'')+'</span>':'')+(t.zona==='fuera'?' <span class="pill p-fz">FUERA ZONA</span>':'');}
function extraTipo(t){if(!t.tipoTxt)return false;if(!t.tipo)return true;var r=nk(t.tipoTxt).replace(/\b(s ?g|sgtia|s gtia|gtia|gt|garantia|sin|con|visita|taller|aceptado|acepto|\d+)\b/g,'').trim();return r.length>1;}
var HEAD='<th>Fecha ingreso</th><th>N° orden</th><th>SG/GT/G</th><th>Nombre y apellido</th><th>Domicilio</th><th>Teléfono</th><th>Producto</th><th>Marca</th><th>N° fábrica</th><th>Falla</th><th>Estado / resultado</th>';
function cols(t){var fl=flagOf(t);return '<td class="nw">'+(t.ingreso?ddy(t.ingreso):esc(t.ingresoTxt||''))+'</td><td class="ord">'+esc(t.orden||'')+'</td><td>'+tipoCell(t)+'</td><td class="nm">'+(fl?'<span class="flag '+fl.flag+'">'+(fl.flag==='no'?'⛔':'⚠')+'</span>':'')+esc(t.nombre||'')+'</td><td class="dom">'+esc(t.domicilio||'')+(t.nota?'<div class="muted" style="font-size:.76rem">📝 '+esc(t.nota)+'</div>':'')+'</td><td>'+telLink(t)+'</td><td class="nw">'+esc(t.producto||'')+'</td><td class="nw">'+esc(t.marca||'')+'</td><td class="nw">'+esc(t.nfab||'')+'</td><td class="fa">'+esc(t.falla||'')+'</td><td class="res">'+esc(t.resultado||'')+'</td>';}
function rowCls(t,lead){var fl=flagOf(t);return (lead==='plazo'?(t.estado==='pendiente'?sem(t):''):'')+(t.estado==='hecho'?' done':'')+(fl&&fl.flag==='no'?' no':'');}
function leadCell(t,lead){if(lead==='plazo')return '<td class="lead">'+plazoCorto(t)+'</td>';
  if(lead==='dia')return '<td class="lead">'+(t.estado==='pendiente'?'SIN DÍA':(t.estado==='hecho'?'✔ ':'')+fD(t.fecha)+(t.tecnico?'<br>'+esc(t.tecnico):'')+(t.franja?'<br>'+esc(t.franja):''))+'</td>';
  if(lead==='estado')return '<td class="lead">'+(t.estado==='pendiente'?'SIN TURNO':(t.estado==='hecho'?'✔ HECHO ':'TURNO ')+fD(t.fecha)+(t.fecha&&t.fecha.slice(0,4)!==today().slice(0,4)?'/'+t.fecha.slice(2,4):'')+(t.tecnico?'<br>'+esc(t.tecnico):''))+'</td>';return '';}
function actCell(t){if(t.estado==='pendiente')return '<button class="btn btn-sm btn-green" data-asg="'+t.id+'">Dar turno</button>';
  if(t.estado==='asignado'&&t.fecha<=today())return '<button class="btn btn-sm btn-green" data-done="'+t.id+'">Se hizo ✔</button>'+(t.fecha<today()?' <button class="btn btn-sm" data-asg="'+t.id+'">Reprogramar</button>':'');
  if(t.estado==='asignado')return '<button class="btn btn-sm" data-asg="'+t.id+'">Cambiar día</button>';return '';}
function tabla(list,lead,leadName){if(!list.length)return '';
  return '<div class="xl-wrap"><table class="xl"><thead><tr><th>'+leadName+'</th>'+HEAD+'</tr></thead><tbody>'+
    list.map(function(t){return '<tr class="'+rowCls(t,lead)+'" data-ed="'+t.id+'">'+leadCell(t,lead).replace(/<\/td>$/,'<div class="act">'+actCell(t)+'</div></td>')+cols(t)+'</tr>';}).join('')+'</tbody></table></div>';}

document.addEventListener('click',function(e){var b;
  if(e.target.closest('.ov'))return;
  if(e.target.closest('a.tel'))return;
  if((b=e.target.closest('[data-asg]'))){asignar(byId[b.dataset.asg]);return;}
  if((b=e.target.closest('[data-done]'))){var t=byId[b.dataset.done];t.estado='hecho';touch(t);render();toast('Marcado como hecho ✔');return;}
  if((b=e.target.closest('[data-st]'))){var x=byId[b.dataset.id];x.estado=b.dataset.st;touch(x);render();toast('Orden '+(x.orden||'')+': '+TST[x.estado]);return;}
  if((b=e.target.closest('[data-dn]'))){var y=b.dataset.dn.split('|');notaDia(y[0],y[1]);return;}
  if((b=e.target.closest('[data-pr]'))){var x2=b.dataset.pr.split('|');imprimir(x2[0],x2[1].split(','));return;}
  if((b=e.target.closest('[data-ed]'))){openItem(b.dataset.ed);return;}
  if((b=e.target.closest('[data-go]'))){go(b.dataset.go);if(b.dataset.past){var p=pasados().sort(function(a,b){return a.fecha<b.fecha?-1:1;})[0];if(p){WK=monday(p.fecha);render();}}return;}
  if((b=e.target.closest('[data-filt]'))){FILT[b.dataset.filt]=b.dataset.val;render();return;}
});
function openItem(id){var it=byId[id];if(it)(it.kind==='taller'?editTaller:it.kind==='cliente'?editCliente:editTurno)(it);}

/* ---------- Sin turno ---------- */
function sortPl(a,b){var pa=plazo(a)||'0',pb=plazo(b)||'0';return pa<pb?-1:pa>pb?1:0;}
function chipsF(key,opts){return '<div class="chips">'+opts.map(function(o){return '<button class="chip'+(FILT[key]===o[0]?' on':'')+'" data-filt="'+key+'" data-val="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';}

/* ---------- Taller: cargar / editar ---------- */
function editTaller(t){var nuevo=!t;t=t?JSON.parse(JSON.stringify(t)):{id:uid(),kind:'taller',orden:'',equipo:'',cliente:'',tecnico:'',fecha:'',ingreso:today(),estado:'esperando',nota:''};
  var b='<div class="g3"><label class="f">N° de orden<input class="i" id="t-orden" inputmode="numeric" value="'+esc(t.orden)+'"></label><label class="f">Equipo <small>(ej.: HEL Samsung)</small><input class="i" id="t-equipo" value="'+esc(t.equipo||'')+'"></label><label class="f">Entró al taller<input class="i" type="date" id="t-ingreso" value="'+esc(t.ingreso||'')+'"></label></div>'+
    '<label class="f">Cliente<input class="i" id="t-cliente" value="'+esc(t.cliente||'')+'"></label>'+
    '<div class="step"><div class="q">Estado</div>'+opts('est',Object.keys(TST).map(function(k){return [k,TST[k]];}),t.estado,'')+'</div>'+
    '<div class="g2"><label class="f">Técnico que lo repara<select class="i" id="t-tec"><option value="">— Sin asignar —</option>'+DB.cfg.tecnicos.map(function(n){return '<option'+(n===t.tecnico?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></label><label class="f">Día que lo repara<input class="i" type="date" id="t-fecha" value="'+esc(t.fecha||'')+'"></label></div>'+
    '<label class="f">Nota <small>(repuesto que falta, qué hay que hacer…)</small><textarea class="i" id="t-nota">'+esc(t.nota||'')+'</textarea></label><p class="err" id="tErr" hidden></p>';
  var o=modal(nuevo?'Orden al taller':'Taller · orden '+esc(t.orden),b,(nuevo?'':'<span class="left"><button class="btn btn-danger" data-a="del">Borrar</button></span>')+'<button class="btn" data-a="x">Cancelar</button><button class="btn btn-primary btn-big" data-a="save">Guardar</button>');bindOpts(o);
  o.querySelector('#t-orden').addEventListener('change',function(){var v=this.value.trim();if(!v)return;var m=DB.items.filter(function(x){return x.kind==='turno'&&String(x.orden||'').trim()===v;}).sort(function(a,b){return (b.fecha||'')>(a.fecha||'')?1:-1;})[0];
    if(m){if(!o.querySelector('#t-cliente').value)o.querySelector('#t-cliente').value=m.nombre||'';if(!o.querySelector('#t-equipo').value)o.querySelector('#t-equipo').value=[m.producto,m.marca].filter(Boolean).join(' ');toast('Datos tomados de la orden '+v);}});
  o.querySelector('.md-f').onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;if(a==='x')return closeM();
    if(a==='del'){if(!confirm('¿Borrar la orden '+t.orden+' del taller?'))return;drop(byId[t.id]);closeM();render();return;}
    t.orden=o.querySelector('#t-orden').value.trim();t.equipo=o.querySelector('#t-equipo').value.trim();t.cliente=o.querySelector('#t-cliente').value.trim();t.ingreso=o.querySelector('#t-ingreso').value;t.tecnico=o.querySelector('#t-tec').value;t.fecha=o.querySelector('#t-fecha').value;t.nota=o.querySelector('#t-nota').value.trim();t.estado=ov(o,'est')||'esperando';
    if(!t.orden){var er=o.querySelector('#tErr');er.textContent='Poné el número de orden.';er.hidden=false;return;}
    var cur=byId[t.id];if(cur){Object.assign(cur,t);touch(cur);}else touch(t);closeM();render();toast('Guardado');};}

/* ---------- Imprimir hoja del técnico ---------- */
function imprimir(tec,days){var h='<div class="pr-h"><svg viewBox="0 0 682 212"><use href="#logo"/></svg><h1>Turnos · '+esc(tec)+'</h1><span>Impreso '+dd(today())+'</span></div>';
  days.forEach(function(d){var its=dayItems(tec,d),dn=dayNote(tec,d);if(!its.length&&!dn)return;h+='<div class="pr-day">'+fL(d)+(dn?' — '+esc(dn.texto):'')+'</div>';if(!its.length)return;h+='<table class="pr-t"><thead><tr><th>Orden</th><th>Tipo</th><th>Horario</th><th>Cliente</th><th>Domicilio</th><th>Teléfono</th><th>Producto</th><th>Marca</th><th>N° fábrica</th><th>Falla</th><th>Nota</th><th style="width:16%">Resultado</th></tr></thead><tbody>'+
    its.map(function(t){if(t.kind==='taller')return '<tr><td>'+esc(t.orden)+'</td><td>TALLER</td><td></td><td>'+esc(t.cliente||'')+'</td><td></td><td></td><td colspan="2">'+esc(t.equipo||'')+'</td><td></td><td></td><td>'+esc(t.nota||'')+'</td><td></td></tr>';
      return '<tr><td>'+esc(t.orden)+'</td><td>'+(t.tipo?TIPO[t.tipo]+(t.tipo==='SG'&&t.visita?' '+money(t.visita):''):esc(t.tipoTxt||''))+(t.flete?' · '+t.flete.toUpperCase():'')+'</td><td>'+esc(t.franja||'')+'</td><td>'+esc(t.nombre)+'</td><td>'+esc(t.domicilio)+(t.zona==='fuera'?' (FUERA DE ZONA)':'')+'</td><td>'+esc(t.telefono)+'</td><td>'+esc(t.producto)+'</td><td>'+esc(t.marca)+'</td><td>'+esc(t.nfab)+'</td><td>'+esc(t.falla)+'</td><td>'+esc(t.nota)+'</td><td>'+esc(t.resultado||'')+'</td></tr>';}).join('')+'</tbody></table>';});
  $('print').innerHTML=h;setTimeout(function(){window.print();},50);}
